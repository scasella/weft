   type size, fading as it lands (V-4). When no landing point is found, the :only-child rule below lets it rise and
   fade where it was. */
@media (prefers-reduced-motion: no-preference) {
  .dk-deck[data-state="shed"] { animation: dk-grow 380ms var(--ease-shuttle) 40ms backwards; }
  html:active-view-transition-type(to-child)::view-transition-old(root) { animation: none; opacity: 0; }
  html:active-view-transition-type(to-child)::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  html:active-view-transition-type(to-child)::view-transition-old(dk-follow):only-child { animation: dk-rise 200ms var(--ease-out) both; }
  .dk-lane[data-state="queued"], .dk-lane[data-state="waiting"] { animation: dk-in 320ms var(--ease-shuttle) both; }
  .dk-lane:nth-child(2) { animation-delay: 40ms; }
  .dk-lane:nth-child(3) { animation-delay: 80ms; }
  .dk-lane:nth-child(4) { animation-delay: 120ms; }
  .dk-lane:nth-child(n + 5) { animation-delay: 160ms; }
}
@keyframes dk-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
/* the dock's top edge rises: the deck's height grows from the strip's to its cap (the reader shrinks with it, once per frame
   for 0.4 s, never per token); overflow is clipped only while it grows */
/* the landscape deck is a side column: nothing grows from a top edge there */
@media (prefers-reduced-motion: no-preference) and (orientation: landscape) and (max-height: 500px) {
  .dk-deck[data-state="shed"] { animation: none; }
}
@keyframes dk-grow { from { max-height: var(--strip-h, 64px); overflow: hidden; } to { max-height: var(--dk-cap); overflow: hidden; } }
/* gone before it can sit long over the thread's new text (only when deck.js found no landing point) */
@keyframes dk-rise { 55% { opacity: 0; } to { opacity: 0; transform: translateY(-40px); } }

/* ---------- §13.8 / §13.9 ---------- */
@media (prefers-contrast: more) {
  .dk-lane { border-top-width: 2px; border-top-color: var(--edge); }
  .dk-lane[aria-current="true"] { outline: 2px solid var(--ink); outline-offset: -2px; }
  .dk-gen { border-width: 2px; }
}
@media (forced-colors: active) {
  .dk-lane[aria-current="true"] { outline: 2px solid Highlight; outline-offset: -2px; }
  .dk-bar > i, .dk-caret, .dk-shut-line { background: CanvasText; }
  .dk-err, .dk-gen { border: 1px solid CanvasText; }
  .dk-ws-seg[aria-checked="true"] { background: Highlight; color: HighlightText; }
}

/* 30-edit.css */
/* Module 4: the in-place editor, the composer (#tail-compose and the fork composer), the edit bar (#editbar) and
   the selection bar (#selbar). Spec §7, §4.16, §14.2. Tokens from 00-tokens.css only; class prefix ed-. */

/* ---------- the field (editor and composer) ---------- */
.ed-area {
  display: block;
  width: calc(100% + 12px);
  min-height: calc(max(16px, var(--story-size)) * var(--story-lh) + 6px);
  margin: 0 -6px;
  padding: 3px 6px;
  border: 0;
  border-radius: var(--r-1);
  outline: 2px solid var(--warp);
  outline-offset: 0;
  background: var(--band);
  font-family: var(--font-story);
  font-size: max(16px, var(--story-size));   /* never under 16 px (iOS zoom) */
  line-height: var(--story-lh);
  font-optical-sizing: auto;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  overflow: hidden;
  resize: none;
  color: var(--ink-model);
  font-weight: var(--w-model);
  caret-color: var(--warp);
  -webkit-user-select: text;
  user-select: text;
}
@supports (field-sizing: content) {
  .ed-area { field-sizing: content; }
}
.ed-area:focus-visible { outline: 2px solid var(--warp); outline-offset: 0; box-shadow: 0 0 0 5px color-mix(in oklch, var(--warp) 25%, transparent); }
.ed-area::placeholder { color: var(--ink-muted); font-weight: var(--w-model); font-style: italic; opacity: 1; }
.ed-human { font-weight: var(--w-human); color: var(--ink); }
.ed-model { font-weight: var(--w-model); color: var(--ink-model); }
.ed-area.ed-human { font-weight: var(--w-human); color: var(--ink); }

/* edit in place: the textarea takes the passage's place in #thread */
.ed-edit { position: relative; margin: 2px 0 calc(.7em + var(--s-5)); }

/* ---------- the composer ---------- */
.ed-comp { position: relative; font-family: var(--font-story); font-size: var(--story-size); line-height: var(--story-lh); }
.ed-comp:is([data-kind="tail"], [data-kind="opening"]) {
  max-width: calc(var(--story-measure) + var(--gutter));
  margin: .7em 0 var(--s-5);
  padding-left: var(--gutter);
}
/* the warp continues, dashed: this text is not on the thread yet */
.ed-comp:is([data-kind="tail"], [data-kind="opening"])::before {
  content: "";
  position: absolute;
  left: 8px;
  top: 4px;
  bottom: 4px;
  border-left: 2px dashed var(--warp-line);
  pointer-events: none;
}
.ed-comp[data-kind="fork"] { margin: 0 0 calc(.7em + var(--s-5)); }
.ed-comp[data-kind="fork"][data-cont] { margin-top: -.7em; }   /* the head continues the paragraph above it */

.ed-open-t { margin: 0 0 var(--s-2); font: 700 13px/1.3 var(--font-ui); color: var(--ink-muted); }

/* the seam preview: "…the last six words␣first typed words" */
.ed-seam {
  margin: 0 0 var(--s-2);
  font-family: var(--font-story);
  font-size: 15px;
  line-height: 1.42;
  color: var(--ink-muted);
  overflow-wrap: anywhere;
}
.ed-seam-tail { font-style: italic; font-weight: var(--w-model); }
.ed-seam-head { font-weight: var(--w-human); color: var(--ink); }
.ed-join {
  display: inline-block;
  min-width: 2px;
  margin: 0 1px;
  vertical-align: baseline;
  font: 600 12px/1 var(--font-ui);
  color: var(--ink-muted);
}
.ed-join[data-mark="space"], .ed-join[data-mark="break"] {
  padding: 2px 3px 1px;
  border: 1px solid var(--edge);
  border-radius: 2px;
  color: var(--ink);
}
.ed-join[data-mark="none"] { width: 2px; height: 1.05em; margin: 0; background: var(--seam); vertical-align: -0.15em; }

/* branch from a selection: the head stays, the rest is struck through */
.ed-head { margin: 0 0 var(--s-2); white-space: pre-line; }
.ed-head .ed-seam-head { font-family: var(--font-story); }
.ed-rest { margin: var(--s-3) 0 0; white-space: pre-line; color: var(--ink-muted); font-weight: var(--w-model); }
.ed-rest s { text-decoration-thickness: 1.5px; text-decoration-color: var(--ink-muted); }
.ed-rest-cap { margin: var(--s-1) 0 0; font: 600 12px/1.3 var(--font-ui); color: var(--ink-muted); }

/* ---------- the edit bar (#editbar, 56 px, in the dock's normal flow) ---------- */
.ed-barwrap { display: flex; flex-direction: column; }
.ed-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 56px;
  padding: 4px 12px;
  min-width: 0;
}
.ed-bar[hidden] { display: none; }
.ed-cancel {
  flex: none;
  min-height: var(--target);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border-radius: var(--r-1);
  font: 600 15px/1 var(--font-ui);
  color: var(--ink);
}
.ed-change {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
  white-space: nowrap;
  font-size: 13px;
  line-height: 1.25;
  color: var(--ink-muted);
}
.ed-change[hidden] { display: block; visibility: hidden; }
.ed-split { flex: none; display: inline-flex; align-items: stretch; margin-left: auto; }
.ed-save { min-height: var(--target-primary); padding: 0 14px; }
.ed-split .ed-save:not(:last-child) { border-radius: var(--r-1) 0 0 var(--r-1); }
.ed-more {
  min-height: var(--target-primary);
  width: var(--target);
  padding: 0;
  border-radius: 0 var(--r-1) var(--r-1) 0;
  box-shadow: inset 1px 0 0 color-mix(in oklch, var(--on-warp) 40%, transparent);
}
.ed-more .ui-i { width: 18px; height: 18px; transition: transform var(--dur-1) var(--ease-out); }
.ed-more[aria-expanded="true"] .ui-i { transform: rotate(180deg); }
/* waiting buttons stay legible: aria-disabled keeps them focusable, the fill fades */
.ed-bar button[aria-disabled="true"], .ed-split[data-idle] .ed-more { opacity: .45; }

/* ▾ → Overwrite this passage, with its consequence line, above the bar */
.ed-over { padding: var(--s-2) 12px 0; }
.ed-over[hidden] { display: none; }
.ed-overwrite {
  width: 100%;
  min-height: var(--target-primary);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 9px 12px;
  border: 1.5px solid var(--edge);
  border-radius: var(--r-1);
  background: var(--paper-lift);
  text-align: left;
}
.ed-ow-t { font: 600 15px/1.2 var(--font-ui); color: var(--ink); }
.ed-ow-l { font: 400 13px/1.3 var(--font-ui); color: var(--ink-muted); }
.ed-overwrite[aria-disabled="true"] { opacity: 1; }
.ed-overwrite[aria-disabled="true"] .ed-ow-t { color: var(--ink-muted); }

/* the inline question: "Discard changes?" */
.ed-ask-t { flex: 1 1 auto; min-width: 0; padding-left: 4px; font: 700 15px/1.2 var(--font-ui); color: var(--ink); }
.ed-ask .ui-btn, .ed-ask .ed-danger { flex: none; }
.ed-danger {
  min-height: var(--target);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 var(--s-4);
  border: 1.5px solid var(--danger);
  border-radius: var(--r-1);
  background: var(--paper-lift);
  color: var(--danger);
  font: 700 15px/1.2 var(--font-ui);
  white-space: nowrap;
}

/* the composer's bar: Cancel · Join without space · Add · Add and weave */
.ed-gap { flex: 1 1 auto; min-width: 0; }
.ed-tog {
  flex: none;
  min-height: var(--target);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0 8px;
  border-radius: var(--r-1);
  font: 600 14px/1.15 var(--font-ui);
  color: var(--ink);
  text-align: left;
}
.ed-tog-box {
  flex: none;
  position: relative;
  width: 18px;
  height: 18px;
  border: 1.5px solid var(--edge);
  border-radius: 3px;
  background: var(--paper-lift);
}
.ed-tog[aria-pressed="true"] { background: var(--warp-tint); color: var(--warp); }
.ed-tog[aria-pressed="true"] .ed-tog-box { background: var(--warp); border-color: var(--warp); }
.ed-tog[aria-pressed="true"] .ed-tog-box::after {
  content: "";
  position: absolute;
  left: 4.5px;
  top: 1px;
  width: 5px;
  height: 10px;
  border: solid var(--on-warp);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.ed-add { min-height: var(--target); padding: 0 14px; }
.ed-addw { min-height: var(--target-primary); padding: 0 14px; }

/* phones, and the landscape phone's dock column (§3.4: about 360 px while composing, too narrow for one row of
   ~445 px): two rows — Cancel and the join toggle, then Add and Add and weave across the thumb zone. The opening has
   no join toggle, so its bar stays one row. */
@media (max-width: 479px), (orientation: landscape) and (max-height: 500px) {
  .ed-cbar:not(.ed-cbar-open) { flex-wrap: wrap; row-gap: 4px; padding-top: 6px; padding-bottom: 6px; }
  .ed-cbar:not(.ed-cbar-open) .ed-cancel { order: 0; }
  .ed-cbar:not(.ed-cbar-open) .ed-gap { order: 1; }
  .ed-cbar:not(.ed-cbar-open) .ed-tog { order: 2; }
  .ed-cbar:not(.ed-cbar-open)::after { content: ""; order: 3; flex-basis: 100%; height: 0; }
  .ed-cbar:not(.ed-cbar-open) .ed-add { order: 4; flex: 1 1 0; }
  .ed-cbar:not(.ed-cbar-open) .ed-addw { order: 5; flex: 1.7 1 0; }
  .ed-cbar .ed-add, .ed-cbar .ed-addw { min-height: var(--target-primary); }
}
@media (max-width: 359px) {
  .ed-save { padding: 0 10px; font-size: 14px; }
  .ed-cancel { padding: 0 8px; }
}

/* key hints only where there is a keyboard and a pointer (§3.6) */
.ed-kbd { display: none; }
@media (hover: hover) and (pointer: fine) {
  .ed-kbd { display: inline; margin-left: 2px; font: 500 12px/1 var(--font-num); color: inherit; opacity: .8; }
  .ed-cancel:hover, .ed-tog:hover { background: color-mix(in oklch, var(--warp-tint) 60%, transparent); }
  .ed-tog[aria-pressed="true"]:hover { background: var(--warp-tint); }
  .ed-overwrite:not([aria-disabled="true"]):hover { border-color: var(--warp); }
}

/* ---------- the selection bar (#selbar), replacing the deck strip ---------- */
.ed-sel { padding: 6px 8px 4px; border-bottom: 1px solid var(--rule); }
.ed-sel-cap {
  margin: 0 8px 2px;
  font: 400 13px/1.3 var(--font-ui);
  color: var(--ink-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ed-sel-row { display: flex; align-items: stretch; gap: 2px; }
.ed-sb {
  flex: 1 1 auto;
  min-width: var(--target);
  min-height: 52px;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 4px 6px;
  border-radius: var(--r-1);
  color: var(--ink);
}
.ed-sb .ui-i { width: 22px; height: 22px; }
.ed-sb-t { font: 600 12px/1.1 var(--font-ui); white-space: nowrap; }
.ed-sb[aria-disabled="true"] { opacity: .45; }
@media (hover: hover) and (pointer: fine) {
  .ed-sb:not([aria-disabled="true"]):hover { background: color-mix(in oklch, var(--warp-tint) 60%, transparent); }
}
/* one row of wide buttons, except in the landscape phone's 300 px dock column (below) */
@media (min-width: 600px) and (min-height: 501px) {
  .ed-sel-row { justify-content: flex-start; }
  .ed-sb { flex: 0 0 auto; flex-direction: row; gap: 8px; min-height: var(--target); padding: 0 14px; }
  .ed-sb-t { font-size: 14px; }
}

/* ---------- landscape phone: the dock is a 300 px column (§3.4) ---------- */
@media (orientation: landscape) and (max-height: 500px) {
  .ed-bar { padding-left: 8px; padding-right: 8px; }
  /* the selection bar keeps the phone's icon-over-label buttons, two by two: four in a row need ~340 px */
  .ed-sel-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; }
  .ed-sb { min-width: 0; }
}

/* ---------- §13.8, §13.9, §12 ---------- */
@media (prefers-contrast: more) {
  .ed-join[data-mark="space"], .ed-join[data-mark="break"], .ed-tog-box, .ed-overwrite { border-width: 2px; }
}
@media (forced-colors: active) {
  .ed-area { outline-color: Highlight; background: Canvas; }
  .ed-tog[aria-pressed="true"] .ed-tog-box { background: Highlight; border-color: Highlight; }
  .ed-danger { border-color: CanvasText; color: CanvasText; }
  .ed-join[data-mark="none"] { background: CanvasText; }
}
@media (prefers-reduced-motion: reduce) {
  .ed-more .ui-i { transition: none; }
}

/* 31-menu.css */
/* Module 4: the node menu (a sheet), the delete dialog (an in-page <dialog>), the Details sheet and the copy
   fallback sheet. Spec §4.12, §4.14, §4.15. Tokens from 00-tokens.css only; class prefix ed-. */

/* ---------- node menu ---------- */
.ed-menu { list-style: none; margin: 0; padding: 0 0 var(--s-2); border-top: 1px solid var(--rule); }
.ed-mrow { border-bottom: 1px solid var(--rule); }
.ed-mrow-pair { display: flex; }
.ed-mrow-pair > .ed-mi { flex: 1 1 0; min-width: 0; }
.ed-mrow-pair > .ed-mi-pair { border-left: 1px solid var(--rule); padding-left: var(--s-4); }
.ed-mi {
  width: 100%;
  min-height: var(--target-primary);
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: 6px var(--s-4);
  text-align: left;
  color: var(--ink);
}
.ed-mi .ui-i { width: 22px; height: 22px; color: var(--ink-model); }
.ed-mi-t { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ed-mi-l { font: 500 16px/1.25 var(--font-ui); }
.ed-mi-r, .ed-mi-n { font: 400 13px/1.3 var(--font-ui); color: var(--ink-muted); }
.ed-mi-k {
  display: none;
  flex: none;
  min-width: 2.2em;
  text-align: right;
  font-size: 13px;
  font-style: normal;
  color: var(--ink-muted);
}
.ed-mi-danger .ed-mi-l, .ed-mi-danger .ui-i { color: var(--danger); }
/* a row that waits: still focusable and readable, the reason on its second line (never faded below 4.5:1) */
.ed-mi[aria-disabled="true"] { opacity: 1; cursor: default; }
.ed-mi[aria-disabled="true"] .ed-mi-l, .ed-mi[aria-disabled="true"] .ui-i { color: var(--ink-muted); }
.ed-mi[aria-disabled="true"] .ui-i { opacity: .6; }
.ed-flash { animation: ed-flash var(--dur-2) var(--ease-out) 2; }
@keyframes ed-flash { 50% { color: var(--ink); } }
/* key hints only where there is a keyboard and a pointer (§3.6) */
@media (hover: hover) and (pointer: fine) {
  .ed-mi-k { display: inline; }
  .ed-mi:not([aria-disabled="true"]):hover { background: color-mix(in oklch, var(--warp-tint) 60%, transparent); }
}
.ed-mi:focus-visible { outline-offset: -2px; box-shadow: none; }

/* ---------- delete dialog ---------- */
.ed-dlg {
  position: fixed;
  inset: auto 0 0 0;
  z-index: var(--z-sheet);
  width: 100%;
  max-width: 100%;
  margin: 0;
  padding: 0;
  border: 0;
  border-top: 1px solid var(--edge);
  border-radius: var(--r-2) var(--r-2) 0 0;
  background: var(--paper-lift);
  color: var(--ink);
  font: 400 15px/1.4 var(--font-ui);
  transform: translateY(100%);
  transition: transform var(--dur-3) var(--ease-out), overlay var(--dur-3) allow-discrete, display var(--dur-3) allow-discrete;
}
.ed-dlg[open] { transform: none; }
@starting-style { .ed-dlg[open] { transform: translateY(100%); } }
.ed-dlg::backdrop { background: var(--scrim); }
.ed-dlg:focus, .ed-dlg:focus-visible { outline: none; box-shadow: none; }
.ed-dlg-in { padding: var(--s-5) var(--s-4) max(var(--s-4), env(safe-area-inset-bottom, 0px)); }
.ed-dlg-t { margin: 0 0 var(--s-2); font: 700 20px/1.2 var(--font-ui); color: var(--ink); }
.ed-dlg-b { margin: 0 0 var(--s-5); font: 400 16px/1.45 var(--font-ui); color: var(--ink); overflow-wrap: anywhere; }
.ed-dlg-acts { display: flex; gap: var(--s-2); }
.ed-dlg-acts > * { flex: 1 1 0; min-height: var(--target-primary); }
@media (min-width: 600px) {
  .ed-dlg { width: min(480px, 100%); margin: 0 auto; border-left: 1px solid var(--edge); border-right: 1px solid var(--edge); }
}
@media (orientation: landscape) and (max-height: 500px) {
  .ed-dlg { inset: auto 0 0 auto; width: min(480px, 100%); margin: 0; border-radius: 0; border-left: 1px solid var(--edge); right: env(safe-area-inset-right, 0px); }
}

/* ---------- Details ---------- */
.ed-dt-lead {
  margin: 0 var(--s-4) var(--s-3);
  font-family: var(--font-story);
  font-size: 15px;
  line-height: 1.42;
}
.ed-dl { margin: 0; padding: 0 0 var(--s-3); border-top: 1px solid var(--rule); }
.ed-dl-row {
  display: grid;
  grid-template-columns: minmax(6.5em, 30%) minmax(0, 1fr);
  gap: var(--s-3);
  align-items: baseline;
  padding: 10px var(--s-4);
  border-bottom: 1px solid var(--rule);
}
.ed-dl dt { font: 600 13px/1.3 var(--font-ui); color: var(--ink-muted); }
.ed-dl dd { margin: 0; font: 400 15px/1.35 var(--font-ui); color: var(--ink); overflow-wrap: anywhere; }
.ed-dl dd.num { font-family: var(--font-num); font-size: 14px; }
.ed-dl-note { display: block; font: 400 13px/1.3 var(--font-ui); color: var(--ink-muted); }
.ed-dl-row[data-key="id"] dd { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); font-size: 13px; }
.ed-dl-copy { min-height: var(--target); padding: 0 12px; font-family: var(--font-ui); }

/* ---------- copy fallback ---------- */
.ed-copy-note { margin: 0 var(--s-4) var(--s-2); color: var(--ink-muted); font-size: 14px; }
.ed-copy-area {
  display: block;
  width: calc(100% - 2 * var(--s-4));
  margin: 0 var(--s-4) var(--s-3);
  padding: var(--s-2);
  border: 1.5px solid var(--edge);
  border-radius: var(--r-1);
  background: var(--paper);
  color: var(--ink);
  font: 400 16px/1.45 var(--font-story);
  resize: vertical;
}

@media (prefers-reduced-motion: reduce) {
  .ed-dlg, .ed-dlg[open] { transform: none; transition: opacity var(--dur-1) linear, overlay var(--dur-1) allow-discrete, display var(--dur-1) allow-discrete; }
  @starting-style { .ed-dlg[open] { transform: none; opacity: 0; } }
  .ed-flash { animation: none; }
}
@media (forced-colors: active) {
  .ed-dlg { border: 1px solid CanvasText; }
  .ed-mi-danger .ed-mi-l { color: CanvasText; }
}

/* 40-lens.css */
/* Probability lens (module 5): heat highlights over the thread, the tapped word's outline, the legend strip
   (#legend-slot), the Probabilities toggle (#lens-toggle-slot) and the token panel (#token-panel).
   Spec §2.1–2.2 (heat tokens), §6, §13. Tokens from 00-tokens.css only; class prefix lz-. Visibility of the regions
   themselves is the shell's (02-shell.css); this file styles inside them. */

/* ---------- heat (§6.2): one Highlight per bucket, one range per word; the two least likely are underlined.
   Thresholds (tokens.js bucket(), QA round 1, superseding §6.2's table): p ≥ 0.4 untinted; lz-40 [0.2, 0.4);
   lz-20 [0.05, 0.2); lz-05 [0.01, 0.05) dotted; lz-00 < 0.01 solid. ---------- */
::highlight(lz-40) { background-color: var(--heat-40); }
::highlight(lz-20) { background-color: var(--heat-20); }
::highlight(lz-05) {
  background-color: var(--heat-05);
  text-decoration: underline dotted var(--heat-line);
  text-decoration-thickness: 1.5px;
  text-underline-offset: 3px;
}
::highlight(lz-00) {
  background-color: var(--heat-00);
  text-decoration: underline solid var(--heat-line);
  text-decoration-thickness: 1.5px;
  text-underline-offset: 3px;
}
::highlight(lz-tap) { color: var(--ink); }

/* the tapped word: a 2 px --warp outline, a box in #reader placed from the word's client rects (lens.js) */
.lz-tapbox {
  position: absolute;
  z-index: 1;
  pointer-events: none;
  overflow-anchor: none;
  border-radius: 2px;
  outline: 2px solid var(--warp);
  outline-offset: 1px;
}

/* ---------- toggle (§6.3) ---------- */
.lz-toggle .ui-i { width: 22px; height: 22px; }

/* ---------- legend strip (§6.3): 44 px (not 40: its buttons are §13.1's 44 px targets), --paper-sunk,
   1 px --edge bottom ---------- */
.lz-legend {
  height: 44px;
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  padding: 0 2px 0 calc(var(--side) + env(safe-area-inset-left, 0px));
  background: var(--paper-sunk);
  border-bottom: 1px solid var(--edge);
  font: 500 12px/1 var(--font-ui);
  color: var(--ink-muted);
  white-space: nowrap;
}
/* a narrow strip keeps the title, the swatches and the stepper; the end words go */
.lz-legend { container-type: inline-size; }
@container (max-width: 359px) {
  .lz-end { display: none; }
}
/* "N close calls" is wider than §6.3's "N unsure": the spacing is a little tighter so a two-digit count keeps both
   end words whole at 393 px, and a three-digit count (legend.js sets .lz-long) drops them on a 393 px phone */
@container (max-width: 389px) {
  .lz-legend.lz-long .lz-end { display: none; }
}
.lz-title { flex: none; font: 700 13px/1 var(--font-ui); color: var(--ink); }
.lz-ramp { flex: 0 1 auto; display: flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; }
.lz-end { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.lz-sws { display: flex; gap: 2px; flex: none; }
.lz-sw { display: block; width: 13px; height: 14px; border: 1px solid var(--edge); background: var(--paper); }
.lz-sw[data-b="40"] { background: var(--heat-40); }
.lz-sw[data-b="20"] { background: var(--heat-20); }
.lz-sw[data-b="05"] { background: var(--heat-05); border-bottom: 2px dotted var(--heat-line); }
.lz-sw[data-b="00"] { background: var(--heat-00); border-bottom: 2px solid var(--heat-line); }
.lz-fb, .lz-note { min-width: 0; white-space: normal; font: 500 12px/1.2 var(--font-ui); }
.lz-fb { color: var(--ink-muted); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.lz-note { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lz-step, .lz-off {
  position: relative;
  flex: none;
  height: 44px;
  min-width: var(--target);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--r-1);
  font: 600 13px/1 var(--font-ui);
  color: var(--ink);
}
.lz-step { margin-left: auto; gap: 2px; padding: 0 6px; }
.lz-step .num { font-weight: 600; }
.lz-step .ui-i { width: 16px; height: 16px; stroke-width: 2.2; }
.lz-off { display: none; padding: 0 12px; color: var(--warp); }
.lz-step:focus-visible, .lz-off:focus-visible { outline-offset: -2px; }
@media (min-width: 480px) {
  .lz-off { display: inline-flex; }
  .lz-step[hidden] + .lz-off { margin-left: auto; }
}
@media (hover: hover) and (pointer: fine) {
  .lz-step:hover, .lz-off:hover { background: color-mix(in oklch, var(--warp-tint) 60%, transparent); }
}

/* ---------- token panel (§6.5): non-modal, in the dock's flow ---------- */
#token-panel.lz-panel {
  --lz-dock-pad: max(var(--s-2), env(safe-area-inset-bottom, 0px));   /* the dock's bottom padding (02-shell.css) */
  background: var(--paper-lift);
  color: var(--ink);
  /* the lift colour runs to the bottom of the screen, over the dock's bottom padding */
  margin-bottom: calc(-1 * var(--lz-dock-pad));
  padding-bottom: var(--lz-dock-pad);
}
/* the panel itself takes focus when it opens (n, a tap): an inset ring when the keyboard brought it there (§13.2;
   tokenpanel.js sets data-lz-ring), none after a tap */
#token-panel.lz-panel:focus { outline: none; box-shadow: none; }
#token-panel.lz-panel[data-lz-ring="on"]:focus-visible { outline: 2px solid var(--warp); outline-offset: -2px; box-shadow: none; }
.lz-in {
  display: flex;
  flex-direction: column;
  min-height: 0;
  /* at most 70% of the space below the top bar (§3.3, §6.5) for the whole panel, so less the panel's own bottom
     padding (the dock's, which #token-panel carries under this box); rows scroll inside, the head and buttons stay */
  max-height: calc((var(--vvh, 100dvh) - var(--topbar-h) - env(safe-area-inset-top, 0px)) * 0.7 - var(--lz-dock-pad, 0px));
}

.lz-top { flex: none; display: flex; align-items: center; padding: 5px 4px 2px var(--side); }
.lz-id { flex: 1 1 auto; min-width: 0; }
.lz-word {
  /* 1.45, not 1.15: the box clips (overflow hidden, for the ellipsis) and Literata's glyph box is about 1.44 em, so a
     tighter line cut the tail of a "y" or "g" to a dot (QA LZ-2); .lz-top's top padding gives back the extra */
  font: 600 24px/1.45 var(--font-story);
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lz-meta { margin-top: 2px; font: 500 13px/1.3 var(--font-ui); color: var(--ink-muted); }
.lz-meta .num { color: var(--ink); font-weight: 600; }

.lz-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.lz-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-2); padding: 6px var(--side) 4px; }
.lz-h h3 { font: 700 14px/1.2 var(--font-ui); color: var(--ink); }
.lz-else { flex: none; font: 500 12px/1 var(--font-ui); color: var(--ink-muted); }
.lz-else .num { color: var(--ink); }
.lz-none { padding: 10px var(--side); font: 400 14px/1.35 var(--font-ui); color: var(--ink-muted); }

.lz-alts { list-style: none; margin: 0; padding: 0; }
.lz-row {
  display: grid;
  /* the word column holds the Written row's word and its "Written" label too, so keep it wide enough for both */
  grid-template-columns: 22px minmax(0, 148px) minmax(40px, 1fr) 44px;
  align-items: center;
  gap: 10px;
  margin: 0 var(--side);
  padding: 0 8px 0 6px;
  border-top: 1px solid var(--rule);
}
.lz-written { height: 36px; }
.lz-alt { height: var(--target); cursor: pointer; -webkit-user-select: none; user-select: none; }
.lz-alt[aria-checked="true"] { background: var(--warp-tint); }
.lz-alt:focus-visible { outline-offset: -2px; }
.lz-rd {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid var(--edge);
  display: grid;
  place-items: center;
}
.lz-written .lz-rd { width: 18px; height: 18px; border-style: dotted; }
.lz-alt[aria-checked="true"] .lz-rd { border-color: var(--warp); }
.lz-alt[aria-checked="true"] .lz-rd::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--warp); }

.lz-wc { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.lz-wc small { flex: none; font: 600 12px/1 var(--font-ui); color: var(--ink-muted); }
.lz-w {
  justify-self: start;
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 3px 4px 4px 2px;
  font: 400 17px/1 var(--font-story);
  color: var(--ink);
}
.lz-w[data-b="40"] { background: var(--heat-40); }
.lz-w[data-b="20"] { background: var(--heat-20); }
.lz-w[data-b="05"] { background: var(--heat-05); text-decoration: underline dotted var(--heat-line); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.lz-w[data-b="00"] { background: var(--heat-00); text-decoration: underline solid var(--heat-line); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.lz-sp { color: var(--ink-muted); font-family: var(--font-ui); margin-right: 1px; text-decoration: none; }

/* neutral bars: --ink-model fill on a --rule track (as in reference frame C: an --edge track sits too close to the
   Written row's --ink-muted fill); the selected row's fill is --warp; Written is --ink-muted */
.lz-bar { position: relative; height: 6px; background: var(--rule); }
.lz-bar i { position: absolute; inset: 0 auto 0 0; width: calc(var(--lz-p, 0) * 100%); min-width: 2px; background: var(--ink-model); }
.lz-alt[aria-checked="true"] .lz-bar i { background: var(--warp); }
.lz-written .lz-bar i { background: var(--ink-muted); }
.lz-pc { font: 600 13px/1 var(--font-num); text-align: right; color: var(--ink); }

.lz-own {
  display: flex;
  align-items: center;
  gap: 10px;
  width: calc(100% - 2 * var(--side));
  height: var(--target);
  margin: 0 var(--side);
  padding: 0 6px;
  border-top: 1px solid var(--rule);
  font: 600 15px/1 var(--font-ui);
  color: var(--ink);
}
.lz-own .ui-i { width: 18px; height: 18px; margin: 0 2px; }
.lz-ownrow { margin: 0 var(--side); padding: 6px 0; border-top: 1px solid var(--rule); }
.lz-field {
  width: 100%;
  height: var(--target);
  padding: 0 10px;
  border: 1.5px solid var(--edge);
  border-radius: var(--r-1);
  background: var(--paper);
  color: var(--ink);
  font: 400 16px/1.2 var(--font-story);
}
.lz-field:focus-visible { outline-offset: 0; }

.lz-foot { flex: none; border-top: 1px solid var(--rule); }
.lz-preview { padding: 8px var(--side) 0; font: 400 13.5px/1.4 var(--font-ui); color: var(--ink-muted); }
.lz-preview em { font-family: var(--font-story); font-style: normal; color: var(--ink); }
.lz-preview em i { font-style: italic; color: var(--ghost); }
.lz-stays { display: block; margin-top: 2px; }
.lz-caret { display: inline-block; width: .45em; height: .95em; margin-left: 2px; vertical-align: -0.14em; background: var(--weft); }
.lz-wait { padding: 6px var(--side) 0; font: 600 13px/1.3 var(--font-ui); color: var(--ink-muted); }
.lz-btns { display: flex; gap: var(--s-2); padding: 10px var(--side) var(--s-2); }
.lz-btns > button { flex: 1 1 auto; min-width: 0; height: var(--target-primary); padding: 0 8px; gap: 6px; }
.lz-btns > .ui-btn { border-color: var(--ink); }
.lz-btns > button > span { overflow: hidden; text-overflow: ellipsis; }
/* a narrow panel (320 px phones, the landscape dock column): the labels keep their room, the icons go */
.lz-in { container-type: inline-size; }
@container (max-width: 379px) {
  .lz-btns > button > .ui-i { display: none; }
}
@container (min-width: 460px) {
  .lz-row { grid-template-columns: 22px minmax(0, 200px) minmax(40px, 1fr) 44px; }
}
@container (max-width: 339px) {
  .lz-btns { gap: 6px; }
  .lz-btns > button { padding: 0 4px; font-size: 14px; }
  .lz-row { grid-template-columns: 22px minmax(0, 118px) minmax(32px, 1fr) 40px; gap: 8px; }
}

@media (hover: hover) and (pointer: fine) {
  .lz-alt:not([aria-checked="true"]):hover, .lz-own:hover { background: color-mix(in oklch, var(--warp-tint) 50%, transparent); }
}


/* landscape phone (§3.4): the panel is the dock's right column and fills it */
@media (orientation: landscape) and (max-height: 500px) {
  #token-panel.lz-panel { --lz-dock-pad: env(safe-area-inset-bottom, 0px); }
  .lz-in { max-height: none; height: 100%; }
  .lz-legend { padding-left: calc(var(--side) + env(safe-area-inset-left, 0px)); }
}

/* tablet (§3.5): the panel stays in the dock, max 560 px of content, aligned with the column */
@media (min-width: 768px) and (min-height: 501px) {
  .lz-in { max-width: calc(560px + 2 * var(--side)); margin-left: calc(72px - var(--side)); }
  .lz-legend { padding-left: 72px; }
}
@media (min-width: 1280px) and (min-height: 501px) {
  .lz-in { margin-left: 0; }
  .lz-legend { padding-left: var(--side); }
}

/* §13.8 */
@media (prefers-contrast: more) {
  .lz-tapbox { outline-width: 3px; }
  .lz-bar { background: var(--edge); }
}

/* §13.9: heat survives as underline styles only (dotted 05, solid 00, wavy 20, none 40) */
@media (forced-colors: active) {
  ::highlight(lz-40) { background-color: transparent; text-decoration: none; }
  ::highlight(lz-20) { background-color: transparent; text-decoration: underline wavy CanvasText; text-underline-offset: 3px; }
  ::highlight(lz-05) { background-color: transparent; text-decoration: underline dotted CanvasText; }
  ::highlight(lz-00) { background-color: transparent; text-decoration: underline solid CanvasText; }
  .lz-tapbox { outline-color: Highlight; }
  /* the swatches keep their system colours (no forced-color-adjust: §13.9 reserves that for the icon sprite);
     their bottom edges carry the underline styles: dotted 05, solid 00, dashed for the wavy 20, none for 40 */
  .lz-sw[data-b="20"] { border-bottom: 2px dashed CanvasText; }
  .lz-sw[data-b="05"] { border-bottom: 2px dotted CanvasText; }
  .lz-sw[data-b="00"] { border-bottom: 2px solid CanvasText; }
  .lz-w[data-b="20"] { text-decoration: underline wavy CanvasText; }
  .lz-alt[aria-checked="true"] { background: Highlight; color: HighlightText; }
  .lz-bar i { background: CanvasText; }
  .lz-alt[aria-checked="true"] .lz-bar i { background: HighlightText; }
}

/* 50-tree.css */
/* Tree (module 6): the Tree sheet and the ≥ 1280 panel (§8, §3.5–3.6), the Alternatives sheet (§4.13),
   the fork map strip (§4.17) and the overview (§8.7). Class prefix tr-; tokens from 00-tokens.css only. */

/* ---------- container: the sheet's body (or the panel's scroller) scrolls; the head and toolbar stick ---------- */
.tr-scroller { position: relative; }
.tr-top {
  position: sticky;
  top: 0;
  z-index: 3;
  padding: 4px 8px 8px 16px;
  background: var(--paper-lift);
  border-bottom: 1px solid var(--edge);
}
.tr-meta {
  margin: 0;
  font: 400 13px/1.35 var(--font-ui);
  color: var(--ink-muted);
  text-wrap: balance;
}
.tr-meta .num { font-size: 12.5px; }
.tr-meta-i { white-space: nowrap; }
.tr-headt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-top: 2px; }
.tr-headt .tr-meta { margin: 0; }

/* toolbar (one row, 44 px controls) */
.tr-tools { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tr-tools-gap { flex: 1 1 0; min-width: 0; }
.tr-pill {
  flex: none;
  height: var(--target);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 11px;
  border: 1.5px solid var(--edge);
  border-radius: var(--r-1);
  font: 600 14px/1 var(--font-ui);
  color: var(--ink);
  white-space: nowrap;
}
.tr-pill .ui-i { width: 18px; height: 18px; }
.tr-pill .ui-i.tr-caret { width: 14px; height: 14px; margin-left: -2px; }
.tr-pill .num { font-weight: 600; }
.tr-pill[aria-pressed="true"], .tr-pill[aria-expanded="true"] {
  background: var(--warp-tint);
  border-color: var(--warp);
  color: var(--warp);
}
@media (max-width: 374px) {
  .tr-pill { padding: 0 8px; gap: 4px; }
  .tr-tools { gap: 4px; }
  /* 320 px: the five controls fit one row only without the decorative leading icons (the words stay, §13.3) */
  .tr-pill:not(.tr-bm-pill) > .ui-i:first-child { display: none; }
}

/* Jump menu */
.tr-menu {
  position: absolute;
  left: 16px;
  top: calc(100% - 4px);
  z-index: 4;
  min-width: 248px;
  padding: 4px 0;
  background: var(--paper-lift);
  border: 1px solid var(--edge);
  border-radius: var(--r-1);
  box-shadow: 0 10px 28px color-mix(in oklch, var(--ink) 20%, transparent);
  overflow-y: auto; /* tree-sheet.js caps max-height to the room below the Jump button */
  overscroll-behavior: contain;
}
.tr-menu-i {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-4);
  width: 100%;
  min-height: var(--target);
  padding: 0 var(--s-4);
  font: 600 15px/1.2 var(--font-ui);
  color: var(--ink);
}
.tr-menu-i:focus-visible { outline-offset: -2px; box-shadow: none; }
.tr-key {
  display: none;
  font: 600 12px/1 var(--font-num);
  color: var(--ink-muted);
  padding: 3px 6px;
  border: 1px solid var(--rule);
  border-radius: var(--r-1);
}
@media (hover: hover) and (pointer: fine) {
  .tr-key { display: inline-block; }
  .tr-menu-i:hover, .tr-pill:hover { background-color: color-mix(in oklch, var(--warp-tint) 60%, transparent); }
}

/* search field (replaces the toolbar; 16 px so iOS never zooms) */
.tr-search { position: relative; display: flex; align-items: center; gap: 4px; }
.tr-q-ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-muted); display: grid; pointer-events: none; }
.tr-q-ic .ui-i { width: 18px; height: 18px; }
.tr-q {
  flex: 1;
  min-width: 0;
  height: var(--target);
  padding: 0 10px 0 36px;
  font: 400 16px/1.2 var(--font-ui);
  color: var(--ink);
  background: var(--paper);
  border: 1.5px solid var(--edge);
  border-radius: var(--r-1);
  -webkit-appearance: none;
  appearance: none;
}
.tr-q::placeholder { color: var(--ink-muted); opacity: 1; }
.tr-q::-webkit-search-cancel-button { display: none; }
.tr-q:focus-visible { outline-offset: 1px; }

/* ---------- the outline: spine and fans (§8.4) ---------- */
.tr-depths, .tr-group, .tr-vlist, .tr-slist { list-style: none; margin: 0; padding: 0; }
.tr-depth { display: block; }
.tr-vlist { position: relative; }
.tr-list { padding-bottom: var(--s-2); }

.tr-row {
  position: relative;
  display: flex;
  align-items: center;
  height: 44px;
  padding-left: 8px;
  color: var(--ink);
}
.tr-row.is-cur { background: var(--warp-tint); }
.tr-row.is-focus { box-shadow: inset 3px 0 0 var(--warp); }

/* spine column: the thread down the left, solid to the cursor and dashed below it, drawn over the elbows */
.tr-spine { position: relative; flex: none; width: 40px; height: 44px; }
.tr-spine::before, .tr-spine::after {
  content: "";
  position: absolute;
  left: 19px;
  width: 0;
  height: 50%;
  z-index: 1;
  border-left: 2px solid transparent;
}
.tr-spine::before { top: 0; }
.tr-spine::after { top: 50%; }
.tr-row[data-st="solid"] .tr-spine::before, .tr-row[data-sb="solid"] .tr-spine::after { border-left-color: var(--warp-line); }
.tr-row[data-st="dashed"] .tr-spine::before, .tr-row[data-sb="dashed"] .tr-spine::after { border-left: 2px dashed var(--warp-line); }
.tr-bead {
  position: absolute;
  left: 14px;
  top: 16px;
  z-index: 2;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--paper-lift);
  border: 2px solid var(--warp-line);
}
.tr-row.is-cur .tr-bead { left: 11px; top: 13px; width: 18px; height: 18px; background: var(--weft); border: 1.5px solid var(--on-weft); }
/* fan rows join the spine with an elbow in their lineage dye: after the spine row they fan down, before it up */
.tr-elbow {
  position: absolute;
  left: 19px;
  width: 22px;
  height: 22px;
  z-index: 0;
  border: 0 solid var(--tr-dye);
  border-left-width: 2px;
}
.tr-row.is-after .tr-elbow, .tr-row.is-next .tr-elbow { bottom: 21px; border-bottom-width: 2px; border-bottom-left-radius: 12px; }
.tr-row.is-before .tr-elbow { top: 21px; border-top-width: 2px; border-top-left-radius: 12px; }
/* rows inside an expanded subtree: an elbow from the parent's swatch, indented 22 px per level (capped) */
.tr-sub-elbow {
  position: absolute;
  left: calc(8px + 40px + (var(--tr-lv, 1) - 1) * 22px + 6px);
  bottom: 21px;
  width: 16px;
  height: calc(var(--tr-rise, 1) * 44px - 12px);
  z-index: 0;
  border-left: 2px solid var(--tr-dye);
  border-bottom: 2px solid var(--tr-dye);
  border-bottom-left-radius: 10px;
  pointer-events: none;
}

.tr-main {
  flex: 1 1 auto;
  min-width: 0;
  height: 44px;
  display: flex;
  align-items: center;
  padding: 0 0 0 calc(var(--tr-lv, 0) * 22px);
  color: inherit;
  text-align: left;
  border-radius: 0;
}
.tr-main:focus-visible, .tr-exp:focus-visible, .tr-more:focus-visible { outline-offset: -2px; box-shadow: none; }
.tr-ix {
  flex: none;
  width: 34px;
  display: flex;
  align-items: center;
  gap: 3px;
  font: 600 12px/1 var(--font-num);
  color: var(--ink-muted);
}
.ui-i.tr-sw { width: 15px; height: 10px; stroke: var(--tr-dye, currentColor); stroke-width: 2.4; }
.tr-snwrap { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.tr-deep { font: 600 12px/1 var(--font-num); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr-sn {
  flex: 1 1 auto;
  min-width: 0;
  font: 400 15px/1.2 var(--font-story);
  font-optical-sizing: auto;
  color: var(--ink-model);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tr-sn.is-human { font-weight: var(--w-human); }
.tr-row.is-on .tr-sn { color: var(--ink); }
.tr-sn.is-empty { font: 500 13px/1.2 var(--font-ui); color: var(--ink-muted); }
.tr-cues { flex: none; display: flex; align-items: center; gap: 6px; padding-left: 6px; }
.tr-cues:empty { display: none; }
.tr-here {
  font: 700 12px/1 var(--font-ui);
  padding: 4px 6px;
  background: var(--weft);
  color: var(--on-weft);
  white-space: nowrap;
}
.tr-udot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--warp); }
.ui-i.tr-bm { width: 16px; height: 16px; color: var(--warp); }
.tr-tag {
  font: 600 12px/1 var(--font-ui);
  color: var(--ink-muted);
  padding: 3px 5px;
  border: 1px solid var(--edge);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
}
.tr-tag.is-new { color: var(--warp); border-color: var(--warp); }
.tr-tag.is-writing { color: var(--ink); }
.tr-caret-glyph { display: inline-block; width: 6px; height: 12px; margin-left: 4px; background: var(--weft); }
.tr-exp {
  flex: none;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1px;
  font: 600 13px/1 var(--font-num);
  color: var(--ink-muted);
}
.tr-exp .ui-i { width: 14px; height: 14px; stroke-width: 2.4; }
.tr-exp[aria-expanded="true"] { color: var(--warp); }
.tr-gap { flex: none; width: 44px; }
.tr-more { flex: none; width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink-muted); }
.tr-more .ui-i { width: 18px; height: 18px; }
/* 320–374 px: inline, "You are here" left the cursor row 40 px of words at 320 (V-22). There the pill drops under
   the words, inside the same fixed 44 px row (virtualised rows depend on it); the other cues stay on the first line */
@media (max-width: 374px) {
  .tr-row.is-cur > .tr-main {
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr);
    grid-template-rows: auto auto;
    grid-auto-columns: auto;
    align-content: center;
    row-gap: 2px;
  }
  .tr-row.is-cur > .tr-main > .tr-ix { grid-area: 1 / 1 / 3 / 2; }
  .tr-row.is-cur > .tr-main > :is(.tr-sn, .tr-snwrap) { grid-area: 1 / 2; }
  .tr-row.is-cur .tr-cues { display: contents; }
  .tr-row.is-cur .tr-cues > * { grid-row: 1; align-self: center; margin-left: 6px; }
  .tr-row.is-cur .tr-cues > .tr-here { grid-area: 2 / 2; justify-self: start; margin-left: 0; padding: 3px 6px; }
}

/* "+ 14 more" (fans cap at 6 rows) */
.tr-main.tr-fanmore {
  gap: 6px;
  padding-left: calc(var(--tr-lv, 0) * 22px + 2px);
  font: 600 14px/1 var(--font-ui);
  color: var(--warp);
}
.tr-fan-plus { width: 32px; text-align: center; font: 700 16px/1 var(--font-ui); }

/* the Next group of a leaf: "No branches yet" + Weave N */
.tr-row.is-empty { height: auto; min-height: 44px; padding-block: 4px; }
.tr-emptyrow { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--s-2); padding: 0 var(--s-4) 0 0; }
.tr-empty-t { flex: 1; min-width: 0; padding-left: 2px; font: 400 14px/1.3 var(--font-ui); color: var(--ink-muted); }
.tr-weave { flex: none; min-height: var(--target); padding: 0 12px; }
.tr-weave[aria-disabled="true"] { opacity: .38; }

@media (hover: hover) and (pointer: fine) {
  .tr-main:hover, .tr-exp:hover, .tr-more:hover { background-color: color-mix(in oklch, var(--warp-tint) 55%, transparent); }
  .tr-row.is-cur .tr-main:hover { background-color: transparent; }
}

/* ---------- search results and the bookmark list: 64 px rows, the path as a breadcrumb ---------- */
.tr-res {
  position: relative;
  display: flex;
  align-items: center;
  height: 64px;
  padding-left: var(--s-4);
  border-bottom: 1px solid var(--rule);
}
.tr-main.tr-res-main {
  height: 64px;
  flex-direction: column;
  align-items: stretch;
  justify-content: center;
  gap: 7px;
  padding: 0;
}
.tr-res-l1 { display: flex; align-items: center; min-width: 0; }
.tr-res-l2 { display: flex; align-items: center; gap: var(--s-2); min-width: 0; overflow: hidden; padding-left: 34px; }
.tr-res-depth { flex: none; font: 600 12px/1 var(--font-num); color: var(--ink-muted); white-space: nowrap; }
.tr-crumbs { display: flex; align-items: center; gap: 3px; min-width: 0; overflow: hidden; }
.ui-i.tr-sw.tr-crumb { width: 12px; height: 8px; stroke-width: 2.6; }
.tr-crumb-more { font: 600 12px/1 var(--font-ui); color: var(--ink-muted); }
.tr-res .tr-sn { color: var(--ink); }
::highlight(tr-match) {
  background-color: var(--warp-tint);
  color: var(--ink);
  /* longhands: Chromium drops the shorthand's thickness inside ::highlight and with it the whole underline */
  text-decoration-line: underline;
  text-decoration-color: var(--warp);
  text-decoration-thickness: 2px;
}
.tr-mark { background: var(--warp-tint); color: var(--ink); text-decoration: underline 2px var(--warp); text-underline-offset: 3px; }
.tr-note { padding: var(--s-5) var(--s-4); font: 400 15px/1.45 var(--font-ui); color: var(--ink-muted); }

/* ---------- footer (thumb zone): Root · Last fork · Walk ---------- */
.tr-foot { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.tr-foot-btns { display: flex; gap: var(--s-2); }
.tr-foot .ui-btn.tr-fb { flex: 1 1 0; min-width: 0; min-height: var(--target-primary); padding: 0 8px; font-size: 14px; gap: 6px; }
.tr-help { font: 400 13px/1.3 var(--font-ui); color: var(--ink-muted); }

/* landscape phone: every row counts */
@media (orientation: landscape) and (max-height: 500px) {
  .tr-help { display: none; }
  .tr-foot .ui-btn.tr-fb { min-height: var(--target); }
  .tr-top { padding-bottom: 6px; }
}

/* ---------- the persistent panel at ≥ 1280 (§3.6) ---------- */
.tr-aside { display: none; }
.tr-aside:focus { outline: none; box-shadow: none; } /* only ever focused as a fallback (tabindex -1) */
@media (min-width: 1280px) and (min-height: 501px) {
  .tr-aside:not([hidden]) {
    display: flex;
    flex-direction: column;
    width: 400px;
    min-height: 0;
    background: var(--paper-lift);
    border-left: 1px solid var(--edge);
    color: var(--ink);
  }
  .tr-aside-head { flex: none; display: flex; align-items: center; gap: var(--s-2); min-height: 56px; padding: 6px 4px 0 var(--s-4); }
  .tr-aside-title { flex: 1; min-width: 0; font: 700 20px/1.2 var(--font-ui); }
  .tr-aside-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .tr-aside-foot {
    flex: none;
    display: flex;
    padding: var(--s-2) var(--s-4) max(var(--s-2), env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--edge);
    background: var(--paper-lift);
  }
}

/* ---------- Alternatives sheet (§4.13) ---------- */
.tr-alts { list-style: none; margin: 4px 0 0; padding: 0; border-top: 1px solid var(--rule); }
.tr-alt { position: relative; display: flex; align-items: flex-start; border-bottom: 1px solid var(--rule); }
.tr-alt.is-reading { background: var(--warp-tint); }
.tr-alt-main {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 44px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 4px 12px var(--s-4);
  text-align: left;
  color: inherit;
}
.tr-alt-main:focus-visible { outline-offset: -2px; box-shadow: none; }
.tr-alt-ix {
  flex: none;
  width: 36px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding-top: 5px;
  font: 600 12px/1 var(--font-num);
  color: var(--ink-muted);
}
.tr-alt-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.tr-alt-sn {
  font: 400 15px/1.42 var(--font-story);
  color: var(--ink-model);
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  line-clamp: 3;
  overflow: hidden;
}
.tr-alt-sn.is-human { font-weight: var(--w-human); }
.tr-alt.is-reading .tr-alt-sn { color: var(--ink); }
.tr-alt-cues { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font: 600 12px/1.2 var(--font-ui); color: var(--ink-muted); }
.tr-alt-cues:empty { display: none; }
.tr-alt-cue { display: inline-flex; align-items: center; gap: 4px; }
.tr-alt .tr-more { margin-top: 6px; }
.tr-alt.is-archived .tr-alt-sn { color: var(--ink-muted); }
.tr-alt.is-archived .ui-i.tr-sw { opacity: .45; }
.tr-restore { flex: none; min-height: var(--target); margin: 10px 12px 10px 0; padding: 0 12px; }
.tr-alt-arch {
  display: block;
  width: 100%;
  min-height: var(--target);
  margin-bottom: var(--s-2);
  padding: 0 var(--s-4);
  text-align: left;
  font: 600 14px/1 var(--font-ui);
  color: var(--warp);
}
/* both footer buttons share the row from their one-line width (393 px and up keep one line); at 320–360 px they
   shrink (min-width: 0) and their labels wrap to two lines inside the 16 px gutters instead of running off screen */
.tr-alt-sheet .ui-sheet-foot > .tr-alt-w { flex: 1 1 auto; min-width: 0; padding: 0 10px; white-space: normal; text-align: center; line-height: 1.15; }
.tr-alt-w > span { min-width: 0; text-wrap: balance; }
.tr-alt-w[aria-disabled="true"] { opacity: .38; }

/* ---------- fork map strip (§4.17) ---------- */
.tr-fm:not(:empty) {
  display: flex;
  align-items: center;
  height: 44px;
  padding: 0 4px 0 var(--s-4);
  border-bottom: 1px solid var(--rule);
}
.tr-fm-label { flex: none; margin-right: 6px; font: 600 12px/1 var(--font-ui); color: var(--ink-muted); }
.tr-fm-scroll {
  flex: 1 1 auto;
  min-width: 0;
  height: 44px;
  overflow-x: auto;
  overflow-y: hidden;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
}
.tr-fm-scroll::-webkit-scrollbar { display: none; }
.tr-fm-list { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; height: 44px; width: max-content; }
.tr-fm-item { display: flex; align-items: center; height: 44px; padding: 0 2px; }
.tr-fm-item + .tr-fm-item::before { content: ""; flex: none; width: 10px; height: 2px; margin-right: 2px; background: var(--warp-line); }
.tr-fm-item.is-seen { background: linear-gradient(var(--band), var(--band)) 0 50% / 100% 30px no-repeat; }
.tr-fm-knot {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 44px;
  padding: 0 4px;
  font: 700 12px/1 var(--font-num);
  color: var(--ink);
  touch-action: manipulation;
}
.tr-fm-knot:focus-visible { outline-offset: -2px; box-shadow: none; }
.tr-fm-ring { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--tr-dye); background: var(--paper); }
.tr-fm-knot[aria-current="true"] { padding: 0 6px; }
.tr-fm-knot[aria-current="true"] .tr-fm-ring { box-shadow: 0 0 0 1.5px var(--paper-sunk), 0 0 0 3.5px var(--warp); }
.tr-fm-here { gap: 5px; font: 600 12px/1 var(--font-ui); color: var(--ink); padding-right: 6px; }
.tr-fm-bead { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--weft); border: 1.5px solid var(--on-weft); }
.tr-fm-next { gap: 3px; font: 600 12px/1 var(--font-ui); color: var(--ink-muted); padding-right: 8px; }
.tr-fm-next .num { color: var(--ink); }
.tr-fm-edge { flex: none; min-width: 44px; height: 44px; padding: 0 6px; font: 600 12px/1 var(--font-num); color: var(--warp); white-space: nowrap; }

/* ---------- overview (§8.7) ---------- */
.tr-ov { display: flex; flex-direction: column; min-height: 220px; }
.tr-ov-bar { flex: none; display: flex; align-items: center; gap: 4px; padding: 4px 8px 4px 12px; border-bottom: 1px solid var(--rule); }
.tr-ov-back { min-height: var(--target); padding: 0 12px 0 8px; gap: 4px; }
.tr-ov-back .ui-i { width: 18px; height: 18px; }
.tr-ov-hint { flex: 1; min-width: 0; font: 400 13px/1.3 var(--font-ui); color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-ov-sign { font: 600 24px/1 var(--font-ui); }
.tr-ov-stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: var(--paper); }
.tr-ov-canvas { display: block; touch-action: none; cursor: grab; }
.tr-ov-pick {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: var(--s-2) var(--s-4);
  border-top: 1px solid var(--edge);
  background: var(--paper-lift);
}
.tr-ov-pick-sw { flex: none; display: grid; }
.tr-ov-pick-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.tr-ov-pick-w { font: 400 15px/1.3 var(--font-story); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-ov-pick-d { font: 600 12px/1 var(--font-num); color: var(--ink-muted); }
.tr-ov-go { flex: none; min-height: var(--target-primary); }

/* ---------- §13.8, §13.9 ---------- */
@media (prefers-contrast: more) {
  .tr-spine::before, .tr-spine::after, .tr-row[data-st="dashed"] .tr-spine::before, .tr-row[data-sb="dashed"] .tr-spine::after { border-left-width: 3px; }
  .tr-pill { border-width: 2px; }
  .tr-row.is-cur { outline: 2px solid var(--ink); outline-offset: -2px; }
}
@media (forced-colors: active) {
  /* the current row keeps CanvasText on Canvas and is framed in Highlight: Chromium paints text on a Canvas
     backplate, so HighlightText on a Highlight fill drew white on white (TR-1); the focus ring sits inside the frame */
  .tr-row.is-cur, .tr-alt.is-reading { background: Canvas; color: CanvasText; outline: 2px solid Highlight; outline-offset: -2px; }
  .tr-row.is-cur .tr-main:focus-visible, .tr-alt.is-reading .tr-alt-main:focus-visible { outline-offset: -5px; }
  .tr-row.is-focus { outline: 2px dashed CanvasText; outline-offset: -2px; }
  .tr-fm-knot[aria-current="true"] .tr-fm-ring { outline: 2px solid Highlight; outline-offset: 1px; }
  .tr-alt-w.ui-btn-primary, .tr-ov-go { border: 1px solid CanvasText; }   /* the warp fill is dropped: keep an edge */
  .tr-pill[aria-pressed="true"], .tr-pill[aria-expanded="true"] { border-color: Highlight; outline: 2px solid Highlight; outline-offset: -4.5px; }
  .tr-pill[aria-pressed="true"]:focus-visible, .tr-pill[aria-expanded="true"]:focus-visible { outline-offset: 2px; }   /* focus: the outer ring */
  .tr-row[data-st] .tr-spine::before, .tr-row[data-sb] .tr-spine::after, .tr-elbow, .tr-sub-elbow { border-color: CanvasText; }
  .tr-row[data-st=""] .tr-spine::before, .tr-row[data-sb=""] .tr-spine::after { border-color: transparent; }
  .tr-bead, .tr-fm-ring, .tr-fm-bead { border-color: CanvasText; }
  .tr-here { border: 1px solid CanvasText; }
  .tr-pill, .tr-q, .tr-menu { border-color: CanvasText; }
  .tr-row.is-cur > .tr-main { padding-right: 6px; }   /* the last cue clears the inset focus ring */
}
/* forced colours at 320–374 px: the stacked words and pill (V-22) fit the 34 px inside the cursor row's inset focus ring */
@media (forced-colors: active) and (max-width: 374px) {
  .tr-row.is-cur > .tr-main { row-gap: 0; }
  /* the pill's edge is an inset outline: it paints above the text backplate, which a 1 px border on a 14 px pill loses */
  .tr-row.is-cur .tr-cues > .tr-here { padding: 1px 6px; border: 0; outline: 1px solid CanvasText; outline-offset: -1px; }
}

/* 60-sheets.css */
/* Sheets (module 7): Menu, Library (+ New loom, Rename, a loom's actions, the delete dialog), Settings, Memory,
   Import and export (+ Paste text), About, Help. Spec §9, §13, §14. Class prefix sh-; tokens from 00-tokens.css.
   The sheet itself (head, close, footer, detents) is module 1's primitive; everything here styles inside the body. */

/* ---------- shared rows ---------- */
.sh-gh {
  margin: 0;
  padding: var(--s-5) var(--s-4) 6px;
  font: 700 13px/1.3 var(--font-ui);
  color: var(--ink-muted);
  letter-spacing: 0.01em;
}
.sh-group:first-child > .sh-gh { padding-top: var(--s-1); }
.sh-gsub { margin: 0; padding: 0 var(--s-4) var(--s-2); font: 400 13px/1.4 var(--font-ui); color: var(--ink-muted); }
.sh-rows { border-top: 1px solid var(--rule); }

.sh-row {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  min-height: 48px;
  padding: var(--s-2) var(--s-4);
  border-bottom: 1px solid var(--rule);
  color: var(--ink);
}
.sh-row-t { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sh-row-l { font: 500 15px/1.3 var(--font-ui); color: var(--ink); }
.sh-row-s { font: 400 13px/1.4 var(--font-ui); color: var(--ink-muted); }
.sh-row-stack { flex-direction: column; align-items: stretch; gap: var(--s-2); padding-top: 10px; padding-bottom: var(--s-3); }
.sh-row-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); }
.sh-row-tap { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.sh-row-note { margin: 0; padding: var(--s-2) var(--s-4); font: 400 13px/1.4 var(--font-ui); color: var(--ink-muted); border-bottom: 1px solid var(--rule); }
.sh-row-nav { width: 100%; text-align: left; min-height: 52px; }
.sh-row-nav > .ui-i { width: 18px; height: 18px; color: var(--ink-muted); }

/* radio rows (Generator) */
.sh-radio { align-items: flex-start; padding-top: var(--s-3); padding-bottom: var(--s-3); }
.sh-radio-i {
  flex: none;
  width: 20px;
  height: 20px;
  margin: 1px 0 0;
  accent-color: var(--warp);
  cursor: pointer;
}
.sh-gen-st { display: flex; align-items: center; gap: 6px; }
.sh-gen-st.is-ok { color: var(--ink); font-weight: 600; }
.sh-gen-st.is-bad { color: var(--danger); font-weight: 600; }
/* the demo: "This site's model" can't be chosen (no server). Its name steps back; the reason under it stays at full
   --ink-muted so it reads as the explanation, not as disabled text. */
.sh-radio[data-off] { cursor: default; }
.sh-radio[data-off] .sh-radio-i { cursor: default; }
.sh-radio[data-off] .sh-row-l { color: var(--ink-muted); }
/* Check again, and what it found (the demo's "Still no server here…") beside it, under it when narrow */
.sh-row-check { flex-wrap: wrap; row-gap: var(--s-2); }
.sh-check-note { flex: 1 1 14em; min-width: 0; color: var(--ink); }

/* switch (V-5): the same control as Weave settings' Record probabilities (21-weave.css .dk-ws-switch): a 52 × 44 target,
   a 28 px pill track at top 8 with a 1.5 px --edge border, an 18 px round --ink-muted thumb at 6, 13 that travels 22 px.
   The native checkbox (role=switch) lies over the whole target. */
.sh-sw { position: relative; flex: none; width: 52px; height: var(--target); }
.sh-sw-i { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
.sh-sw-t {
  position: absolute;
  left: 0;
  right: 0;
  top: 8px;
  height: 28px;
  border: 1.5px solid var(--edge);
  border-radius: 14px;
  background: var(--paper);
  pointer-events: none;
  transition: background-color var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out);
}
.sh-sw-k {
  position: absolute;
  top: 13px;
  left: 6px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--ink-muted);
  pointer-events: none;
  transition: transform var(--dur-1) var(--ease-out), background-color var(--dur-1) var(--ease-out);
}
.sh-sw-i:checked + .sh-sw-t { background: var(--warp-fill); border-color: var(--warp-fill); }
.sh-sw-i:checked ~ .sh-sw-k { transform: translateX(22px); background: var(--on-warp); }
.sh-sw-i:focus-visible + .sh-sw-t {
  outline: 2px solid var(--warp);
  outline-offset: 2px;
  box-shadow: 0 0 0 5px color-mix(in oklch, var(--warp) 25%, transparent);
}

/* Branches, Length and Temperature match module 3's Weave settings sheet (§4.11, 21-weave.css .dk-ws-*): copies, so
   the two sheets draw the same controls the same way. */

/* segmented choice (Length, Theme): radios drawn as one bordered strip; Length carries its token count underneath */
.sh-seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  border: 1px solid var(--edge);
  border-radius: var(--r-1);
  overflow: hidden;
  background: var(--paper);
}
.sh-seg-o { position: relative; min-width: 0; }
.sh-seg-i { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 2; }
.sh-seg-f {
  position: relative;
  height: 100%;
  min-height: var(--target);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 0 var(--s-2);
  border-left: 1px solid var(--edge);
  color: var(--ink);
  text-align: center;
}
.sh-seg-o:first-child > .sh-seg-f { border-left: 0; }
.sh-seg-f:has(.sh-seg2) { min-height: 52px; }
.sh-seg1 { font: 600 15px/1 var(--font-ui); }
.sh-seg2 { font: 400 12px/1 var(--font-ui); color: var(--ink-muted); }
.sh-seg-i:checked + .sh-seg-f { background: var(--warp-tint); box-shadow: inset 0 0 0 2px var(--warp); }
.sh-seg-i:checked + .sh-seg-f .sh-seg1 { color: var(--warp); font-weight: 700; }
.sh-seg-i:checked + .sh-seg-f .sh-seg2 { color: var(--ink); }
/* the strip clips outside rings, so the focus ring sits inside the segment (as in §4.11) */
.sh-seg-i:focus-visible + .sh-seg-f { outline: 2px solid var(--warp); outline-offset: -4px; box-shadow: inset 0 0 0 2px var(--warp); }

/* sliders: the native range in --warp-fill (Temperature, Context, Text size), as §4.11's Temperature */
.sh-range {
  display: block;
  width: 100%;
  height: var(--target);
  margin: 0;
  accent-color: var(--warp-fill);
  cursor: pointer;
}
.sh-val { font: 500 15px/1 var(--font-ui); color: var(--ink-muted); white-space: nowrap; }
.sh-val .num { color: var(--ink); font-weight: 600; }
.sh-ends { display: flex; justify-content: space-between; margin-top: -4px; font: 400 13px/1 var(--font-ui); color: var(--ink-muted); }

/* stepper (Branches per weave): one sunk group "− 4 +" */
.sh-step { flex: none; display: flex; align-items: center; border: 1px solid var(--edge); border-radius: var(--r-1); background: var(--paper); }
.sh-step-b { width: var(--target); height: var(--target); display: grid; place-items: center; font: 600 22px/1 var(--font-ui); color: var(--ink); }
.sh-step-b .ui-i { width: 20px; height: 20px; }
.sh-step-v { min-width: 40px; text-align: center; font: 600 18px/1 var(--font-num); color: var(--ink); }

/* text size sample: the open loom's own words in Literata at the chosen size */
.sh-sample {
  margin: 0;
  padding: 10px var(--s-3);
  background: var(--paper);
  border: 1px solid var(--rule);
  font: 400 calc(17px * var(--sh-scale, 1)) / var(--story-lh) var(--font-story);
  color: var(--ink-model);
  overflow-wrap: anywhere;
}

/* fields */
.sh-form { display: flex; flex-direction: column; gap: 6px; padding: var(--s-1) var(--s-4) var(--s-4); }
.sh-form-grow { min-height: 100%; }
.sh-lab { margin-top: var(--s-2); font: 600 14px/1.3 var(--font-ui); color: var(--ink); }
.sh-lab-row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); margin-top: var(--s-2); }
.sh-lab-row .sh-lab { margin-top: 0; }
.sh-in, .sh-ta {
  width: 100%;
  min-width: 0;
  border: 1.5px solid var(--edge);
  border-radius: var(--r-1);
  background: var(--paper);
  color: var(--ink);
}
.sh-in { height: var(--target); padding: 0 var(--s-3); font: 400 16px/1.2 var(--font-ui); }
.sh-ta { min-height: 160px; padding: var(--s-3); font: 400 16px/1.5 var(--font-ui); resize: vertical; }
.sh-ta-story { font-family: var(--font-story); font-size: 16px; line-height: 1.55; color: var(--ink); }
.sh-ta-grow { flex: 1 1 auto; }
.sh-in::placeholder, .sh-ta::placeholder { color: var(--ink-muted); opacity: 1; }
.sh-in:focus-visible, .sh-ta:focus-visible { outline-offset: 0; }
.sh-ta[readonly] { background: var(--paper-sunk); }
.sh-inline { display: flex; gap: var(--s-2); }
.sh-count { font-size: 13px; color: var(--ink-muted); white-space: nowrap; }
.sh-count.is-over { color: var(--danger); font-weight: 600; }
.sh-lead { margin: 0 0 var(--s-1); font: 400 15px/1.45 var(--font-ui); color: var(--ink); }
.sh-hint { margin: var(--s-1) 0 0; font: italic 400 15px/1.45 var(--font-story); color: var(--ink-muted); }
.sh-err { margin: var(--s-2) 0 0; font: 600 14px/1.4 var(--font-ui); color: var(--danger); }
.sh-files .sh-err { margin: var(--s-3) var(--s-4) 0; }
.sh-note-line {
  margin: 0 var(--s-4) var(--s-3);
  padding: var(--s-2) var(--s-3);
  background: var(--paper-sunk);
  border: 1px solid var(--rule);
  font: 500 14px/1.4 var(--font-ui);
  color: var(--ink);
}
.sh-form .sh-note-line { margin: 0; }
.sh-confirm { margin: 0; padding: var(--s-1) var(--s-4) var(--s-4); font: 400 16px/1.45 var(--font-ui); color: var(--ink); }
.ui-btn-primary.sh-danger { background: var(--danger); color: var(--paper); }

/* ---------- Menu (and a loom's actions) ---------- */
.sh-menu { list-style: none; margin: 0; padding: 0 0 var(--s-2); border-top: 1px solid var(--rule); }
.sh-mi {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 52px;
  padding: 0 var(--s-4);
  border-bottom: 1px solid var(--rule);
  font: 500 16px/1.25 var(--font-ui);
  color: var(--ink);
  text-align: left;
}
.sh-mi > .ui-i { color: var(--ink); }
.sh-mi-l { flex: 1 1 auto; min-width: 0; }
.sh-mi-danger, .sh-mi-danger > .ui-i { color: var(--danger); }
.sh-kbd {
  display: inline-block;
  min-width: 24px;
  padding: 3px 6px;
  border: 1px solid var(--edge);
  border-radius: var(--r-1);
  font: 600 13px/1.1 var(--font-ui);
  color: var(--ink-muted);
  text-align: center;
  white-space: nowrap;
}
@media (hover: none) and (pointer: coarse) {
  .sh-mi .sh-kbd { display: none; }   /* key hints are for keyboards */
}

/* ---------- Library ---------- */
.sh-lib { padding-bottom: var(--s-1); }
.sh-libbar { display: flex; flex-wrap: wrap; gap: var(--s-2); padding: 0 var(--s-4) var(--s-3); }
.sh-looms { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.sh-loom { display: flex; align-items: center; padding-right: 6px; border-bottom: 1px solid var(--rule); }
.sh-loom-main {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 60px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
  padding: var(--s-2) var(--s-2) var(--s-2) var(--s-4);
  color: var(--ink);
  text-align: left;
}
.sh-loom-t { font: 600 15px/1.3 var(--font-ui); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-loom-m { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font: 400 13px/1.35 var(--font-ui); color: var(--ink-muted); }
.sh-loom-more { color: var(--ink); }
.sh-tag { display: inline-block; padding: 2px 6px; border: 1px solid var(--edge); font: 700 12px/1.2 var(--font-ui); color: var(--ink); }
.sh-tag-open { border-color: var(--warp-tint); background: var(--warp-tint); color: var(--warp); }
.sh-empty { padding: var(--s-4); }
.sh-empty > p { font: italic 400 16px/1.5 var(--font-story); color: var(--ink-model); }
/* only the example is listed (V-13): one quieter line under it, no buttons */
.sh-empty-hint { padding-block: var(--s-3); }
.sh-empty-hint > p { margin: 0; font-size: 15px; color: var(--ink-muted); }
.sh-btns { display: flex; flex-wrap: wrap; gap: var(--s-2); margin-top: var(--s-3); }
.sh-store { margin: 0; padding: var(--s-3) var(--s-4); font: 400 13px/1.4 var(--font-ui); color: var(--ink-muted); }
.sh-store.is-bad { color: var(--danger); font-weight: 600; }

/* ---------- Import and export ---------- */
.sh-files { padding-bottom: var(--s-3); }
.sh-acts { border-top: 1px solid var(--rule); }
.sh-act {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 56px;
  padding: var(--s-2) var(--s-4);
  border-bottom: 1px solid var(--rule);
  color: var(--ink);
  text-align: left;
}
.sh-act > .ui-i { color: var(--ink); }
.sh-act-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sh-act-l { font: 500 15px/1.3 var(--font-ui); }
.sh-act-s { font: 400 13px/1.35 var(--font-ui); color: var(--ink-muted); }

/* ---------- About and Help ---------- */
.sh-prose, .sh-help { padding: 0 var(--s-4) var(--s-4); font: 400 15px/1.5 var(--font-ui); color: var(--ink); }
.sh-prose > p + p { margin-top: 10px; }
.sh-lockup { font: 400 19px/1.3 var(--font-story); color: var(--ink); margin-bottom: var(--s-1); }
.sh-lockup b { font-weight: 700; }
.sh-ph { margin: var(--s-5) 0 6px; font: 700 15px/1.3 var(--font-ui); color: var(--ink); }
.sh-hsec:first-child .sh-ph { margin-top: var(--s-1); }
.sh-ph4 { margin: var(--s-4) 0 2px; font: 700 14px/1.3 var(--font-ui); color: var(--ink); }
.sh-srcs { list-style: none; margin: var(--s-3) 0 var(--s-2); padding: 0; border-top: 1px solid var(--rule); }
.sh-src { display: flex; flex-direction: column; padding: 2px 0 10px; border-bottom: 1px solid var(--rule); }
.sh-src a { display: inline-flex; align-items: center; align-self: flex-start; min-height: var(--target); font-weight: 600; overflow-wrap: anywhere; }
.sh-src-n { margin-top: -6px; font-size: 13px; line-height: 1.4; color: var(--ink-muted); }
.sh-fine { margin-top: var(--s-4) !important; font-size: 13px; line-height: 1.45; color: var(--ink-muted); }

.sh-basics { margin: 0; padding-left: 1.3em; }
.sh-basics li { padding-left: 2px; }
.sh-basics li + li { margin-top: 6px; }
.sh-hp { margin: 0 0 var(--s-2); font: 400 14px/1.45 var(--font-ui); color: var(--ink-muted); }
.sh-table { width: 100%; border-collapse: collapse; font: 400 14px/1.4 var(--font-ui); color: var(--ink); }
.sh-table th, .sh-table td { padding: var(--s-2) var(--s-2) var(--s-2) 0; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
.sh-table td { padding-right: 0; }
.sh-table thead th { padding-top: 0; font: 700 13px/1.3 var(--font-ui); color: var(--ink-muted); border-bottom-color: var(--edge); }
.sh-table tbody th { width: 42%; font-weight: 400; }
.sh-tg { display: block; font-weight: 600; }
.sh-tw, .sh-tb { display: block; font-size: 13px; line-height: 1.35; color: var(--ink-muted); }
.sh-tb { margin-top: 2px; }
.sh-keys tbody th { width: 40%; }
.sh-combo { display: inline-flex; align-items: center; gap: 1px; white-space: nowrap; margin: 0 2px 4px 0; }
.sh-plus { font-size: 13px; color: var(--ink-muted); }
.sh-table .sh-kbd { color: var(--ink); padding: 2px 5px; min-width: 20px; }
.sh-dev { margin-left: 2px; font: 700 14px/1 var(--font-ui); color: var(--warp); }
.sh-dev-note { margin-top: var(--s-2); }
.sh-scoped, .sh-gloss { margin: 0; }
.sh-scoped dt, .sh-gloss dt { margin-top: 10px; font-weight: 700; }
.sh-scoped dd, .sh-gloss dd { margin: 1px 0 0; color: var(--ink-model); }
.sh-credit {
  margin-top: var(--s-5);
  padding-top: var(--s-3);
  border-top: 1px solid var(--rule);
  font: italic 400 14px/1.5 var(--font-story);
  color: var(--ink-muted);
}

/* ---------- hover (fine pointers only) ---------- */
@media (hover: hover) and (pointer: fine) {
  .sh-mi:not([aria-disabled="true"]):hover,
  .sh-act:not([aria-disabled="true"]):hover,
  .sh-loom-main:not([aria-disabled="true"]):hover,
  .sh-row-nav:hover,
  .sh-row-tap:hover { background: color-mix(in oklch, var(--warp-tint) 55%, transparent); }
  .sh-seg-o:hover .sh-seg-i:not(:checked) + .sh-seg-f,
  .sh-step-b:not([aria-disabled="true"]):hover { background: color-mix(in oklch, var(--warp-tint) 55%, transparent); }
}

/* ---------- §13.8 / §13.9 ---------- */
@media (prefers-contrast: more) {
  .sh-in, .sh-ta, .sh-seg, .sh-sw-t, .sh-step { border-width: 2px; }
  .sh-seg-f { border-left-width: 2px; }
  .sh-row, .sh-mi, .sh-act, .sh-loom { border-bottom-color: var(--edge); }
}
@media (forced-colors: active) {
  .sh-sw-t, .sh-seg, .sh-seg-f, .sh-step, .sh-in, .sh-ta, .sh-tag, .sh-kbd { border-color: CanvasText; }
  .sh-sw-i:checked + .sh-sw-t { background: Highlight; color: HighlightText; border-color: Highlight; }
  /* Chromium draws text on a Canvas backplate, so a Highlight fill would hide HighlightText: the chosen segment
     keeps CanvasText and gets a 3 px Highlight frame instead (the same answer as the Tree's current row) */
  .sh-seg-i:checked + .sh-seg-f { background: Canvas; box-shadow: none; }
  .sh-seg-i:checked + .sh-seg-f::after { content: ""; position: absolute; inset: 2px; border: 3px solid Highlight; pointer-events: none; }
  .sh-seg-i:checked + .sh-seg-f :is(.sh-seg1, .sh-seg2) { color: CanvasText; }
  .sh-sw-k { background: CanvasText; }
  .sh-sw-i:checked ~ .sh-sw-k { background: HighlightText; }
  .sh-sw-i:focus-visible + .sh-sw-t { outline-color: Highlight; box-shadow: none; }
  .sh-seg-i:focus-visible + .sh-seg-f { outline: 2px solid CanvasText; outline-offset: -8px; box-shadow: none; }
  .sh-radio[data-off] .sh-row-l { color: GrayText; }
}
@media (prefers-reduced-motion: reduce) {
  .sh-sw-t, .sh-sw-k { transition-duration: var(--dur-1); transition-property: background-color, border-color; }
}

/* 61-intro.css */
/* First run (module 7), spec §10: the intro and the Probabilities tip, a note docked at the top of the dock in
   #dock-note-intro (--paper-lift; the dock's own 1 px --edge top is its top edge). Never a modal, never over the
   text. Class prefix sh-. The slot's visibility is module 1's (02-shell.css hides it while empty). */

.sh-note {
  padding: var(--s-2) var(--side) var(--s-3);
  background: var(--paper-lift);
  border-bottom: 1px solid var(--rule);
  color: var(--ink);
}
.sh-note-head { display: flex; align-items: center; gap: var(--s-2); min-height: 32px; }
.sh-note-h { margin: 0; font: 700 15px/1.25 var(--font-ui); color: var(--ink); }
.sh-note-h:focus { outline: none; }
.sh-note-h:focus-visible { outline: 2px solid var(--warp); outline-offset: 2px; }
.sh-note-step { font: 500 12.5px/1 var(--font-ui); color: var(--ink-muted); white-space: nowrap; } /* "1 of 3": digits in .num */
.sh-note-skip {
  margin: -6px calc(-1 * var(--s-3)) -6px auto;
  min-width: var(--target);
  min-height: var(--target);
  padding: 0 var(--s-3);
  border-radius: var(--r-1);
  font: 600 14px/1 var(--font-ui);
  color: var(--warp);
  text-align: center;
}
.sh-note-p { margin: 2px 0 0; max-width: 62ch; font: 400 14px/1.42 var(--font-ui); color: var(--ink); }
/* the welcome's credit line (§1), in small type under the text, the Help footer's voice */
.sh-note-credit { margin: 6px 0 0; max-width: 62ch; font: italic 400 12.5px/1.4 var(--font-story); color: var(--ink-muted); }
.sh-note-acts { display: flex; flex-wrap: wrap; gap: var(--s-2); margin-top: 10px; }
.sh-note-b { min-height: var(--target); padding: 0 var(--s-4); }
.ui-btn.sh-note-b { background: var(--paper-lift); }

@media (hover: hover) and (pointer: fine) {
  .sh-note-skip:hover { background: color-mix(in oklch, var(--warp-tint) 60%, transparent); }
}

/* Rings (§10.1): a 2 px --warp ring, never yellow, on the control the current step is about. Selectors use the
   class names spec §4.10 gives module 3 (.dk-weave, .dk-tb[aria-label="Tree"]); the knot ring (step 2) is one rule
   intro.js writes into its own <style id="sh-intro-ring">, naming module 2's knot by data-id (§4.4). */
#app:has(#dock-note-intro[data-ring="weave"]) #actionbar :is(.dk-weave, [data-action="weave"]) {
  outline: 2px solid var(--warp);
  outline-offset: 3px;
}
#app:has(#dock-note-intro[data-ring="tree"]) #actionbar :is(.dk-tb[aria-label="Tree"], [data-action="tree"]) {
  outline: 2px solid var(--warp);
  outline-offset: 2px;
}

/* landscape phone: the dock is a column on the right; the note keeps its padding small */
@media (orientation: landscape) and (max-height: 500px) {
  .sh-note { padding: 6px var(--s-3) var(--s-2); }
  .sh-note-p { font-size: 13.5px; }
  .sh-note-credit { margin-top: 4px; font-size: 12px; }
  .sh-note-acts { margin-top: 6px; }
}

@media (prefers-contrast: more) {
  .sh-note { border-bottom-color: var(--edge); }
}
@media (forced-colors: active) {
  .sh-note { border-bottom: 1px solid CanvasText; }
  #app:has(#dock-note-intro[data-ring="weave"]) #actionbar :is(.dk-weave, [data-action="weave"]),
  #app:has(#dock-note-intro[data-ring="tree"]) #actionbar :is(.dk-tb[aria-label="Tree"], [data-action="tree"]) { outline-color: Highlight; }
}

/* 62-key.css */
/* Your OpenRouter key (module 7): Settings' key group on a static page (no server, e.g. GitHub Pages), the server
   line that stands in for it, the confirm sheet's text, About's three ways, Help's key line. Class prefix sh-; tokens
   from 00-tokens.css. Rows, switches and fields are 60-sheets.css's; only what the key group adds is here. */

/* the key group sits after the Generator group, inside its own host: space its heading like the groups around it
   (60-sheets.css trims the heading of a :first-child group, meant for the sheet's first group) */
.sh-keyhost > .sh-group:first-child > .sh-gh { padding-top: var(--s-5); }

/* the privacy line and the link, under the group heading */
.sh-key .sh-gsub { max-width: 60ch; }
.sh-key-privacy { color: var(--ink); }
.sh-key-get { padding-top: 0; }
.sh-key-link {
  display: inline-flex;
  align-items: center;
  min-height: var(--target);
  font: 600 15px/1.3 var(--font-ui);
  color: var(--warp);
  text-decoration: underline;
  text-underline-offset: 3px;
  overflow-wrap: anywhere;
}
/* ↗: opens openrouter.ai in a new tab. Decoration only: its alt text is empty (the second declaration, where supported),
   and the link says "(opens in a new tab)" in a .ui-sr span instead */
.sh-key-link::after { content: "\2197"; content: "\2197" / ""; margin-left: 4px; font-weight: 400; text-decoration: none; }

/* the saved key: dots and its last 4 characters, in mono; under it, OpenRouter's refusal of it (when it refused) */
.sh-key-saved[hidden] { display: none; }
.sh-key-rej { display: block; margin-top: 2px; color: var(--danger); font-weight: 600; }
.sh-key-rej[hidden] { display: none; }
.sh-key-mask { font: 600 14px/1.3 var(--font-num); color: var(--ink); letter-spacing: 0.02em; }

/* the field: the password input and Show/Hide on one line */
.sh-key-field > .sh-row-l { font-weight: 600; }
.sh-key-field .sh-inline { align-items: stretch; }
/* 16 px at least, as every field (01-base.css): iOS Safari zooms the page into a field set smaller */
.sh-key-in { flex: 1 1 auto; font-family: var(--font-num); font-size: max(16px, 1em); letter-spacing: 0.01em; }
.sh-key-in::placeholder { font-family: var(--font-ui); }
.sh-key-show { flex: none; min-width: 72px; min-height: var(--target); padding: 0 var(--s-3); }
/* one stable label ("Show"); pressed = the key is shown */
.sh-key-show[aria-pressed="true"] { background: var(--warp-tint); color: var(--warp); border-color: var(--warp); }
.sh-key-err { margin: 0; }
.sh-key-err[hidden] { display: none; }

/* Save · Check key · Forget key, and what the check found under them */
.sh-key-acts { flex-direction: column; align-items: stretch; gap: var(--s-2); padding-top: var(--s-3); padding-bottom: var(--s-3); }
.sh-key-btns { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.sh-key-b { min-height: var(--target); padding: 0 var(--s-4); }
.sh-key-b[hidden] { display: none; }
.ui-btn.sh-key-forget { color: var(--danger); }
.sh-key-b[aria-disabled="true"] { opacity: 0.7; cursor: progress; }
.sh-key-result { display: flex; align-items: baseline; gap: 6px; }
.sh-key-result[hidden] { display: none; }
.sh-key-result .ui-dot { flex: none; align-self: center; }
.sh-key-result.is-ok { color: var(--ink); font-weight: 600; }
.sh-key-result.is-bad { color: var(--danger); font-weight: 600; }

/* a page with this site's server: one line in the Generator group instead of the key group */
.sh-key-server { color: var(--ink); }

/* About: what runs on this page now, and the three ways */
.sh-now b { font-weight: 700; }
.sh-ways { list-style: none; margin: var(--s-2) 0 var(--s-3); padding: 0; border-top: 1px solid var(--rule); }
.sh-way { display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.sh-way-h { display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--s-2); }
.sh-way-t { font: 700 15px/1.3 var(--font-ui); color: var(--ink); }
.sh-way-p { font: 400 14px/1.45 var(--font-ui); color: var(--ink-model); }
.sh-way-now { font-size: 11.5px; }

/* Help: where the key lives */
.sh-key-line { color: var(--ink-model); }

@media (hover: hover) and (pointer: fine) {
  .sh-key-link:hover { text-decoration-thickness: 2px; }
  .ui-btn.sh-key-show[aria-pressed="true"]:not(:disabled):hover { background: var(--warp-tint); }
}
@media (prefers-contrast: more) {
  .sh-way { border-bottom-color: var(--edge); }
}
@media (forced-colors: active) {
  .sh-key-link { color: LinkText; }
  .ui-btn.sh-key-forget { color: ButtonText; }
  .sh-key-result.is-bad, .sh-key-rej { color: CanvasText; }
  .sh-key-show[aria-pressed="true"] { background: Highlight; color: HighlightText; border-color: Highlight; }
}
