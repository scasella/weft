/* Design tokens: verbatim from docs/design/spec.md §2.1 (module 1). qa/contrast.mjs reads this file.
   One deliberate change since the spec (QA SL-11): the dark --heat-* lightness is lifted to 0.29 / 0.36 / 0.42 / 0.48
   so the tinted buckets separate from the paper (ΔE 12.7) and from each other (ΔE ≥ 8.3); model ink stays ≥ 4.8:1. */
:root {
  color-scheme: light;

  /* surfaces */
  --paper:       oklch(0.968 0.008 230);   /* reading surface */
  --paper-sunk:  oklch(0.938 0.012 232);   /* dock, shed, legend */
  --paper-lift:  oklch(0.993 0.004 230);   /* sheets, chips, token panel */
  --rule:        oklch(0.86 0.014 240);    /* decorative separators inside one surface */
  --edge:        oklch(0.60 0.025 245);    /* boundaries between surfaces, control borders: >= 3.29:1 on every surface */
  --scrim:       oklch(0.24 0.04 264 / 0.30);

  /* ink */
  --ink:         oklch(0.24 0.040 264);    /* human text, headings, labels */
  --ink-model:   oklch(0.34 0.025 255);    /* model text */
  --ink-muted:   oklch(0.48 0.030 250);    /* meta, captions, text outside the prompt window */
  --ghost:       oklch(0.47 0.085 305);    /* previewed child: italic only */

  /* threads */
  --warp:        oklch(0.46 0.150 266);    /* lines, links, focus ring, selected text */
  --warp-line:   oklch(0.58 0.110 266);    /* the warp down the gutter */
  --warp-fill:   oklch(0.46 0.150 266);    /* primary buttons */
  --on-warp:     oklch(0.985 0.008 266);   /* text on --warp-fill */
  --warp-tint:   oklch(0.915 0.040 266);   /* pressed toggles, selected rows */
  --band:        oklch(0.915 0.040 266);   /* focused passage band */
  --seam:        oklch(0.55 0.110 266);    /* tick at a join */
  --weft:        oklch(0.80 0.150 86);     /* here and now: line and fill only, never text */
  --on-weft:     oklch(0.22 0.040 264);    /* text or strokes on --weft */

  /* status */
  --danger:      oklch(0.50 0.190 27);
  --ok:          oklch(0.48 0.120 150);

  /* eight dye threads, assigned by lineage (§4.4) */
  --dye-1: oklch(0.50 0.16 268);   /* indigo */
  --dye-2: oklch(0.55 0.17 32);    /* madder */
  --dye-3: oklch(0.62 0.14 95);    /* weld */
  --dye-4: oklch(0.55 0.12 150);   /* lichen */
  --dye-5: oklch(0.48 0.15 320);   /* logwood */
  --dye-6: oklch(0.50 0.07 55);    /* walnut */
  --dye-7: oklch(0.56 0.10 200);   /* verdigris */
  --dye-8: oklch(0.52 0.19 355);   /* cochineal */

  /* probability heat (post-QA ranges, set in src/ui/tokens.js): p >= 0.4 is untinted; four tinted buckets, weld to madder */
  --heat-40: oklch(0.920 0.085 98);   /* 0.2 <= p < 0.4 */
  --heat-20: oklch(0.862 0.112 72);   /* 0.05 <= p < 0.2 */
  --heat-05: oklch(0.805 0.135 47);   /* 0.01 <= p < 0.05, dotted underline */
  --heat-00: oklch(0.750 0.152 25);   /* p < 0.01, solid underline */
  --heat-line: var(--ink-model);      /* underline colour */

  /* type */
  --font-story: "Literata", "Iowan Old Style", Charter, Georgia, serif;
  --font-ui: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --text-scale: 1;                                   /* settings.textSize, 0.85..1.3 */
  --story-size: calc(17px * var(--text-scale));
  --story-lh: 1.62;
  --story-measure: 40em;
  --w-human: 580;
  --w-model: 400;

  /* space (4 px base) */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px;
  --side: 16px;                 /* phone side gutter */
  --edge-safe: 32px;            /* no horizontal gesture starts closer than this to a screen edge */

  /* sizes */
  --target: 44px;               /* minimum chrome target */
  --target-primary: 48px;       /* pager, primary sheet buttons */
  --topbar-h: 52px;
  --strip-h: 64px;
  --actbar-h: 64px;
  --gutter: 30px;               /* knot lane inside the reading column */
  --knot: 22px;                 /* ring diameter */
  --weave-h: 52px;

  /* radii */
  --r-0: 0;                     /* chips, lanes, rows, bars, band */
  --r-1: 4px;                   /* buttons, inputs */
  --r-2: 14px;                  /* sheet top corners only */

  /* motion */
  --dur-1: 120ms;               /* presses, fades, every reduced-motion transition */
  --dur-2: 200ms;               /* flip, selvage open/close, preview swap */
  --dur-3: 320ms;               /* sheets */
  --dur-weave: 560ms;           /* the shuttle pass */
  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
  --ease-shuttle: cubic-bezier(0.65, 0, 0.35, 1);

  /* layers */
  --z-tail: 1; --z-dock: 2; --z-toast: 30; --z-sheet: 40;

  /* runtime, set by src/ui/viewport.js */
  --kb: 0px;                    /* keyboard overlap */
  --vvh: 100dvh;                /* visualViewport height */
}

@media (prefers-contrast: more) {
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {

    --warp-line: var(--warp);

@media (forced-colors: active) {
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
    --band: transparent;
    --heat-40: transparent; --heat-20: transparent; --heat-05: transparent; --heat-00: transparent;

  /* §13.5: strokes use CanvasText, focus uses Highlight, heat survives as underline styles only */

/* 01-base.css */
/* Base (module 1): reset, type, shared primitives every module may use.
   Shared classes: .ui-i (icon), .ui-ib (44 px icon button), .ui-btn / .ui-btn-primary (text buttons),
   .ui-chrome (no selection / callout), .ui-sr (visually hidden), .num (mono numbers), .ui-dot. */

/* build.mjs reproduces the Artifact skeleton's reset, which pads :root by the safe areas.
   The shell handles safe areas itself (top bar, dock), so the root must not. */
:root { padding: 0; }

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;              /* only #reader scrolls */
  overscroll-behavior: none;
}
body {
  background: var(--paper);
  color: var(--ink);
  font: 400 15px/1.35 var(--font-ui);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button {
  background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent; text-align: inherit;
}
button:disabled, [aria-disabled="true"] { cursor: default; }
button:disabled, button[aria-disabled="true"] { opacity: .38; }
input, textarea, select { font-size: max(16px, 1em); }   /* iOS never zooms a field */
a { color: var(--warp); text-underline-offset: 3px; }
h1, h2, h3, h4, p, ol, ul, figure { margin: 0; }
ol, ul { padding: 0; }
[hidden] { display: none !important; }
::selection { background: color-mix(in oklch, var(--warp) 28%, transparent); }

/* focus (§13.2) */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--warp);
  outline-offset: 2px;
  box-shadow: 0 0 0 5px color-mix(in oklch, var(--warp) 25%, transparent);
}

/* icons (§2.6): <svg class="ui-i"><use href="#i-name"/></svg> */
.ui-i {
  width: 22px; height: 22px; flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  pointer-events: none;
}

/* chrome that takes long-press: never select, never callout (§11.1) */
.ui-chrome { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

.ui-sr {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}

.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.ui-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }

/* 44 px icon button */
.ui-ib {
  width: var(--target); height: var(--target); flex: none;
  display: inline-grid; place-items: center;
  border-radius: var(--r-1); color: var(--ink);
}
.ui-ib[aria-pressed="true"] { background: var(--warp-tint); color: var(--warp); }

/* text buttons: secondary (outlined) and primary (warp fill) */
.ui-btn, .ui-btn-primary {
  min-height: var(--target); display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  padding: 0 var(--s-4); border-radius: var(--r-1);
  font: 600 15px/1.2 var(--font-ui); white-space: nowrap;
}
.ui-btn { border: 1.5px solid var(--edge); color: var(--ink); background: transparent; }
.ui-btn-primary { background: var(--warp-fill); color: var(--on-warp); font-weight: 700; }
.ui-btn .ui-i, .ui-btn-primary .ui-i { width: 18px; height: 18px; }

@media (hover: hover) and (pointer: fine) {
  .ui-ib:not(:disabled):hover, .ui-btn:not(:disabled):hover { background: color-mix(in oklch, var(--warp-tint) 60%, transparent); }
  .ui-ib[aria-pressed="true"]:hover { background: var(--warp-tint); }
}

/* reduced motion (§12): every transition becomes a --dur-1 fade */
@media (prefers-reduced-motion: reduce) {
  :root { --dur-2: 120ms; --dur-3: 120ms; --dur-weave: 120ms; }
  html { scroll-behavior: auto; }
}

/* §13.8 */
@media (prefers-contrast: more) {
  .ui-btn { border-width: 2px; }
}

/* §13.9 */
@media (forced-colors: active) {
  #sprite { forced-color-adjust: none; }
  :focus-visible { outline-color: Highlight; box-shadow: none; }
  .ui-ib[aria-pressed="true"] { background: Highlight; color: HighlightText; }
  /* SL-7: forced colours drop the warp fill, so a primary button keeps a drawn boundary like the outlined ones */
  .ui-btn-primary { border: 1.5px solid ButtonText; }
}

/* 02-shell.css */
/* Shell (module 1): the #app grid, top bar, generator chip, reader container, dock container and
   the visibility of dock children by mode, sheets, toasts. Layout per spec §3. */

:root {
  --ui-col: 760px;            /* thread column + dock width at >= 1280 (module 2 may align to it) */
  --ui-toast-pad: 0px;        /* set on #app while a toast shows */
}

/* ---------- grid ---------- */
#app {
  display: grid;
  grid-template-areas: "top" "legend" "reader" "dock";
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-columns: minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
  padding-bottom: var(--kb);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
  background: var(--paper);
  color: var(--ink);
  overflow: hidden;
  overflow: clip;   /* SL-6: hidden still lets focus() and scripts scroll #app sideways; clip does not */
}

/* ---------- top bar (§4.1) ---------- */
#topbar {
  grid-area: top;
  position: relative;
  z-index: var(--z-dock);
  display: flex;
  align-items: center;
  gap: 2px;
  min-width: 0;
  height: calc(var(--topbar-h) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) 4px 0 6px;
  background: var(--paper);
  border-bottom: 1px solid var(--edge);
}
.ui-lib {
  flex: 1 1 auto;
  min-width: 0;
  height: var(--target);
  display: flex;
  align-items: center;
  gap: var(--s-2);
  padding: 0 4px 0 6px;
  border-radius: var(--r-1);
  color: var(--ink);
  text-align: left;
}
.ui-lib-t { display: flex; flex-direction: column; min-width: 0; }
.ui-lib-title { display: flex; align-items: center; gap: 4px; min-width: 0; font: 700 16px/1.15 var(--font-ui); }
.ui-lib-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ui-lib-title .ui-i { width: 16px; height: 16px; }
.ui-lib-meta {
  font: 400 13px/1.3 var(--font-ui);
  color: var(--ink-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ui-lib-meta .num { font-size: 12.5px; }
.ui-lib-meta .ui-bad { color: var(--danger); font-weight: 600; }

/* generator chip (§4.2) */
.ui-gen { flex: none; height: var(--target); display: flex; align-items: center; padding: 0 2px; border-radius: var(--r-1); }
.ui-gen-box {
  height: 30px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 9px;
  border: 1px solid var(--edge);
  border-radius: var(--r-1);
  font: 600 13px/1 var(--font-ui);
  color: var(--ink);
  white-space: nowrap;
}
.ui-gen-box .ui-i { width: 16px; height: 16px; }
.ui-gen-l { display: none; }
.ui-gen[data-state="checking"] .ui-gen-box { color: var(--ink-muted); font-weight: 500; }
.ui-gen[data-state="practice"] .ui-gen-box {
  border: 2px solid transparent;
  padding: 0 8px;
  background:
    linear-gradient(var(--paper), var(--paper)) padding-box,
    repeating-linear-gradient(45deg, var(--edge) 0 2px, transparent 2px 5px) border-box;
}
.ui-gen[data-state="nokey"] .ui-dot { background: var(--danger); }
/* the reader's key, refused by OpenRouter (topbar.js, state "rejected"): "warn Key rejected" in --danger, no green dot */
.ui-gen[data-state="rejected"] { min-width: var(--target); justify-content: center; } /* 44 px wide as the glyph alone */
.ui-gen[data-state="rejected"] .ui-gen-box { border-color: var(--danger); color: var(--danger); }
/* static page, no key saved: "Practice | key Add key" in one chip (topbar.js, invite) */
.ui-gen-add {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 18px;
  margin-left: 1px;
  padding-left: 7px;
  border-left: 1px solid var(--rule);
  color: var(--warp);
}
.ui-gen-add .ui-i { width: 16px; height: 16px; }
/* the smallest phones, and phones once the Probabilities toggle joins the bar, keep the key glyph only (the loom title
   needs the room); the chip's name still says "Add key" */
@media (max-width: 359px) {
  .ui-gen-add-t { display: none; }
}
@media (max-width: 479px) {
  #topbar:has(> #lens-toggle-slot:not(:empty)) .ui-gen-add-t { display: none; }
}
/* "Key rejected" keeps its words down to 360, and below that until the Probabilities toggle joins the bar; then the
   warn glyph alone (red border), so the loom title keeps some room. The name still starts with "Key rejected". */
@media (max-width: 359px) {
  #topbar:has(> #lens-toggle-slot:not(:empty)) .ui-gen-x { display: none; }
}

#lens-toggle-slot { display: flex; align-items: center; flex: none; }
#lens-toggle-slot:empty { display: none; }

.ui-tb { flex: none; height: var(--target); padding: 0 10px; border-radius: var(--r-1); font: 600 15px/1 var(--font-ui); color: var(--ink); }
.ui-help-glyph { font: 700 19px/1 var(--font-ui); }
.ui-top-wide, .ui-top-xl { display: none; }

@media (hover: hover) and (pointer: fine) {
  .ui-lib:hover, .ui-gen:hover .ui-gen-box, .ui-tb:hover { background-color: color-mix(in oklch, var(--warp-tint) 60%, transparent); }
  .ui-gen[data-state="practice"]:hover .ui-gen-box {
    background:
      linear-gradient(color-mix(in oklch, var(--warp-tint) 60%, var(--paper)), color-mix(in oklch, var(--warp-tint) 60%, var(--paper))) padding-box,
      repeating-linear-gradient(45deg, var(--edge) 0 2px, transparent 2px 5px) border-box;
  }
}

/* ---------- legend slot and reader ---------- */
#legend-slot { grid-area: legend; min-width: 0; }
#legend-slot:empty { display: none; }

#reader {
  grid-area: reader;
  position: relative;
  min-height: 0;
  min-width: 0;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  overflow-anchor: auto;
  -webkit-overflow-scrolling: touch;
  padding: var(--s-3) var(--side) calc(var(--s-4) + var(--ui-toast-pad));
  background: var(--paper);
}
#reader:focus { outline: none; }
#thread-end { display: block; height: 1px; }

/* Fixed, not absolute: an absolutely placed link inside the scroller would scroll #reader to its top when it
   takes focus, throwing away the reading position. It is still the first focusable element in #reader (§4.3). */
.ui-skip {
  --ui-skip-top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px) + var(--s-2));
  position: fixed;
  top: var(--ui-skip-top);
  left: calc(var(--side) + env(safe-area-inset-left, 0px));
  z-index: 3;
  padding: 10px 14px;
  background: var(--paper-lift);
  border: 1px solid var(--edge);
  border-radius: var(--r-1);
  font: 600 15px/1.2 var(--font-ui);
  color: var(--warp);
  transform: translateY(calc(-100% - var(--ui-skip-top) - 4px));
}
.ui-skip:focus, .ui-skip:focus-visible { transform: none; }

/* ---------- dock (§3.1, §16.8): container + visibility by mode ---------- */
#dock {
  grid-area: dock;
  position: relative;
  z-index: var(--z-dock);
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background: var(--paper-sunk);
  border-top: 1px solid var(--edge);
  padding-bottom: max(var(--s-2), env(safe-area-inset-bottom, 0px));
}
#dock > * { min-width: 0; }
#dock > :empty { display: none; }

/* #dock-note has two owned slots (§16.8 "one at a time, intro wins"):
     #dock-note-intro     module 7: intro steps and tips
     #dock-note-practice  module 3: the practice note
   Each module fills only its own slot (replaceChildren on it, never on #dock-note). The practice note is hidden
   while the intro slot has content; #dock-note itself is hidden while both are empty. */
#dock-note-intro:not(:empty) ~ #dock-note-practice { display: none; }
#dock-note:not(:has(> :not(:empty))) { display: none; }

/* Default (read): selection bar, token panel and edit bar are out. Visibility here only; modules own display inside. */
#app:not([data-mode="select"]) #selbar,
#app:not([data-mode="token"]) #token-panel,
#app:not([data-mode="edit"]):not([data-mode="compose"]) #editbar { display: none; }

/* select: the selection bar replaces the deck strip. While a weave runs, #deck stays (the shed and its lanes keep
   showing, §5.4) and the selection bar sits above it (DOM order); module 3 may hide its own strip inside #deck
   under #app[data-mode="select"]. */
#app[data-mode="select"]:not([data-weaving="true"]) #deck { display: none; }

/* data-weaving (§16.8): the rule above is the only dock visibility that depends on it. Every other dock child keeps
   its visibility during a weave. Modules never add display rules for another module's region; they style inside
   their own region only. */

/* token: the token panel replaces the deck strip and the action bar */
#app[data-mode="token"] :is(#deck, #actionbar, #map-strip, #selbar, #dock-note) { display: none; }

/* edit, compose: the edit bar replaces the dock */
#app:is([data-mode="edit"], [data-mode="compose"]) :is(#deck, #actionbar, #map-strip, #selbar, #token-panel, #dock-note) { display: none; }
#app:is([data-mode="edit"], [data-mode="compose"]) #dock { padding-bottom: max(0px, min(var(--s-2), env(safe-area-inset-bottom, 0px))); }

/* ---------- landscape phone, 852 × 393 (§3.4) ---------- */
@media (orientation: landscape) and (max-height: 500px) {
  :root { --topbar-h: 44px; }
  #app {
    grid-template-areas: "top top" "legend legend" "reader dock";
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-rows: auto auto minmax(0, 1fr);
  }
  #dock {
    width: calc(300px + var(--actbar-h));
    border-top: 0;
    border-left: 1px solid var(--edge);
    padding-right: var(--actbar-h);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #dock > #deck, #dock > #token-panel { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  #dock > #actionbar {
    position: absolute;
    top: 0;
    right: 0;
    bottom: env(safe-area-inset-bottom, 0px);
    width: var(--actbar-h);
    border-left: 1px solid var(--rule);
  }
  #app:is([data-mode="edit"], [data-mode="compose"], [data-mode="token"]) #dock { padding-right: 0; }
}

/* ---------- tablet, 768 and up (§3.5) ---------- */
@media (min-width: 768px) and (min-height: 501px) {
  :root { --topbar-h: 56px; }
  #topbar { padding-left: 10px; padding-right: 8px; gap: 4px; }
  .ui-gen-s { display: none; }
  .ui-gen-l { display: inline; }
  .ui-top-wide { display: inline-grid; }
  .ui-tb.ui-top-wide { display: inline-block; }
}

/* ---------- desktop, 1280 and up (§3.6) ---------- */
@media (min-width: 1280px) and (min-height: 501px) {
  #app {
    grid-template-areas: "top top" "legend aside" "reader aside" "dock aside";
    grid-template-columns: minmax(0, 1fr) auto;
  }
  #app > aside { grid-area: aside; min-height: 0; }   /* module 6's persistent Tree panel, when present */
  .ui-top-xl { display: inline-grid; }
  .ui-tb.ui-top-xl { display: inline-block; }
  #dock {
    justify-self: center;
    width: min(100%, var(--ui-col));
    border-left: 1px solid var(--edge);
    border-right: 1px solid var(--edge);
  }
}

/* ---------- sheets (§4.19) ---------- */
#sheets { display: contents; }
.ui-sheet {
  position: fixed;
  inset: auto 0 0 0;
  z-index: var(--z-sheet);
  margin: 0;
  padding: 0;
  width: 100%;
  max-width: 100%;
  max-height: calc(var(--vvh) * 0.92);
  height: auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--paper-lift);
  color: var(--ink);
  border: 0;
  border-top: 1px solid var(--edge);
  border-radius: var(--r-2) var(--r-2) 0 0;
  font: 400 15px/1.35 var(--font-ui);
  overscroll-behavior: contain;
  transform: translateY(100%);
  transition:
    transform var(--dur-3) var(--ease-out),
    max-height var(--dur-2) var(--ease-out),
    overlay var(--dur-3) allow-discrete,
    display var(--dur-3) allow-discrete;
}
.ui-sheet:not([open]) { display: none; }
.ui-sheet[open] { transform: none; }
@starting-style { .ui-sheet[open] { transform: translateY(100%); } }
.ui-sheet:focus, .ui-sheet:focus-visible { outline: none; box-shadow: none; }
/* §13.2: a keyboard user sees focus on the sheet itself (sheet.js sets data-ring from the last input: keys → on,
   pointer → off, because browsers count a script's focus after a tap as :focus-visible when nothing had focus).
   Inset, so it is not clipped by the screen edge; an outline paints above the sheet's own children. */
.ui-sheet[data-ring="on"]:focus-visible { outline: 2px solid var(--warp); outline-offset: -2px; box-shadow: none; }
/* Detents and the keyboard-safe geometry are bottom-sheet rules: the landscape phone (every sheet a full-height side
   sheet, below) is left out here instead of being out-ranked, so no attribute selector can beat it (SL-1). */
@media not all and (orientation: landscape) and (max-height: 500px) {
  .ui-sheet[data-detent="half"] { max-height: calc(var(--vvh) * 0.6); }
  .ui-sheet[data-detent="full"] { height: calc(var(--vvh) * 0.92); }
}

.ui-sheet::backdrop {
  background: var(--scrim, oklch(0.24 0.04 264 / 0.30));
  opacity: 0;
  transition: opacity var(--dur-3) var(--ease-out), overlay var(--dur-3) allow-discrete, display var(--dur-3) allow-discrete;
}
.ui-sheet[open]::backdrop { opacity: 1; }
@starting-style { .ui-sheet[open]::backdrop { opacity: 0; } }

.ui-sheet-grip { flex: none; height: 18px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.ui-sheet-grip i { display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--edge); }
.ui-sheet-head {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--s-2);
  min-height: 52px;
  padding: 0 4px 4px var(--s-4);
  touch-action: none;
}
.ui-sheet-title { flex: 1; min-width: 0; font: 700 20px/1.2 var(--font-ui); color: var(--ink); overflow-wrap: anywhere; }
.ui-sheet-x { margin-left: auto; }
.ui-sheet-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.ui-sheet-body { padding-bottom: var(--ui-toast-pad); }   /* toast.js sets it on the dialog while a toast shows in it */
.ui-sheet:not([data-foot]) .ui-sheet-body { padding-bottom: calc(max(var(--s-2), env(safe-area-inset-bottom, 0px)) + var(--ui-toast-pad)); }
.ui-sheet-foot {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--s-2);
  padding: var(--s-2) var(--s-4) max(var(--s-2), env(safe-area-inset-bottom, 0px));
  background: var(--paper-lift);
  border-top: 1px solid var(--rule);
}
.ui-sheet-foot:empty { display: none; }
.ui-sheet-foot > .ui-btn, .ui-sheet-foot > .ui-btn-primary { flex: 1; min-height: var(--target-primary); }

/* keyboard-safe: the sheet rides on the keyboard, its footer stays directly above it. On a phone its full detent
   takes everything above the keyboard (8 px short of the top safe area); from 600 px up it is the same 92% as every
   other full sheet, so it starts below the top bar like them (SL-1). */
@media not all and (orientation: landscape) and (max-height: 500px) {
  .ui-sheet[data-kb] {
    inset: auto 0 var(--kb) 0;
    max-height: calc(var(--vvh) - env(safe-area-inset-top, 0px) - 8px);
  }
  .ui-sheet[data-kb][data-detent="half"] { max-height: min(calc(var(--vvh) * 0.6), calc(var(--vvh) - env(safe-area-inset-top, 0px) - 8px)); }
  .ui-sheet[data-kb][data-detent="full"] { height: calc(var(--vvh) - env(safe-area-inset-top, 0px) - 8px); }
}
@media (min-width: 600px) and (min-height: 501px) {
  .ui-sheet[data-kb][data-detent="full"] { height: min(calc(var(--vvh) * 0.92), calc(var(--vvh) - env(safe-area-inset-top, 0px) - 8px)); }
}

.ui-sheet[data-dragging] { transition: none; }

/* 600 and up: a centred 480 px bottom sheet */
@media (min-width: 600px) {
  .ui-sheet { width: min(480px, 100%); margin: 0 auto; border-left: 1px solid var(--edge); border-right: 1px solid var(--edge); }
}
/* 768 and up: Tree and Library are side sheets from the right */
@media (min-width: 768px) and (min-height: 501px) {
  .ui-sheet[data-side] {
    inset: 0 0 var(--kb) auto;
    width: min(400px, 100%);
    height: auto;
    max-height: none;
    margin: 0;
    border: 0;
    border-left: 1px solid var(--edge);
    border-radius: 0;
    transform: translateX(100%);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .ui-sheet[data-side][open] { transform: none; }
  @starting-style { .ui-sheet[data-side][open] { transform: translateX(100%); } }
  .ui-sheet[data-side] .ui-sheet-grip { display: none; }
  .ui-sheet[data-side] .ui-sheet-head { padding-top: var(--s-2); touch-action: auto; }
}
/* landscape phone (§3.4): every sheet, keyboard-safe ones included, is a 480 px side sheet from the right using the
   full height (the detent and [data-kb] rules above do not apply at this size); --kb still lifts its bottom */
@media (orientation: landscape) and (max-height: 500px) {
  .ui-sheet, .ui-sheet[data-side] {
    inset: 0 env(safe-area-inset-right, 0px) var(--kb) auto;
    width: min(480px, 100%);
    height: auto;
    max-height: none;
    margin: 0;
    border: 0;
    border-left: 1px solid var(--edge);
    border-radius: 0;
    transform: translateX(100%);
  }
  .ui-sheet[open], .ui-sheet[data-side][open] { transform: none; }
  @starting-style { .ui-sheet[open], .ui-sheet[data-side][open] { transform: translateX(100%); } }
  .ui-sheet .ui-sheet-grip { display: none; }
  .ui-sheet .ui-sheet-head { padding-top: var(--s-1); touch-action: auto; }
}

/* ---------- toasts (§4.18) ---------- */
.ui-toasts {
  position: fixed;
  inset: auto auto var(--ui-toast-b, 152px) var(--ui-toast-l, 16px);
  z-index: var(--z-toast);
  margin: 0;
  padding: 0;
  border: 0;
  width: max-content;
  max-width: var(--ui-toast-w, calc(100vw - 32px));
  overflow: visible;
  background: transparent;
  color: inherit;
}
.ui-toasts:empty { pointer-events: none; }
.ui-toast {
  display: flex;
  align-items: center;
  gap: var(--s-1);
  min-height: var(--target);
  padding: 0 4px 0 14px;
  background: var(--ink);
  color: var(--paper);
  border-radius: var(--r-1);
  font: 500 15px/1.25 var(--font-ui);
  opacity: 1;
  transform: none;
  transition: opacity var(--dur-1) var(--ease-out), transform var(--dur-2) var(--ease-out);
}
@starting-style { .ui-toast { opacity: 0; transform: translateY(8px); } }
.ui-toast:not(:has(.ui-toast-a)) { padding-right: 14px; }
.ui-toast-t { padding: 11px 0; min-width: 0; overflow-wrap: anywhere; }
.ui-toast-a {
  flex: none;
  min-height: var(--target);
  padding: 0 12px;
  margin-left: var(--s-1);
  border-radius: var(--r-1);
  font: 700 15px/1 var(--font-ui);
  color: var(--paper);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.ui-toast :focus-visible { outline-color: var(--paper); box-shadow: none; }

/* ---------- reduced motion (§12): opacity only, --dur-1 ---------- */
@media (prefers-reduced-motion: reduce) {
  .ui-sheet, .ui-sheet[data-side], .ui-sheet[open], .ui-sheet[data-side][open] {
    transform: none;
    opacity: 1;
    transition: opacity var(--dur-1) linear, overlay var(--dur-1) allow-discrete, display var(--dur-1) allow-discrete;
  }
  .ui-sheet:not([open]) { opacity: 0; }
  @starting-style {
    .ui-sheet[open], .ui-sheet[data-side][open] { transform: none; opacity: 0; }
  }
  .ui-sheet::backdrop { transition-duration: var(--dur-1); }
  .ui-toast { transition: opacity var(--dur-1) linear; }
  @starting-style { .ui-toast { transform: none; } }
}

/* ---------- §13.8, §13.9 ---------- */
@media (prefers-contrast: more) {
  .ui-gen-box { border-width: 2px; }
}
@media (forced-colors: active) {
  .ui-gen-box, .ui-sheet, #dock, #topbar { border-color: CanvasText; }
  .ui-gen-add { border-left-color: CanvasText; color: LinkText; }
  .ui-toast { border: 1px solid CanvasText; }
}

/* 10-thread.css */
/* Thread (module 2): #thread, knots and ticks, the selvage bar, swipe feedback, the ghost preview (#tail-ghost).
   Spec §4.3–§4.7, §3 (the column at each width), §12 (motion), §13 (accessibility). Tokens from 00-tokens.css only. */

#thread {
  --th-lh: calc(var(--story-size) * var(--story-lh));
  position: relative;
  max-width: calc(var(--story-measure) + var(--gutter));
  padding-left: var(--gutter);
  font-family: var(--font-story);
  font-size: var(--story-size);
  line-height: var(--story-lh);
  font-optical-sizing: auto;
  font-weight: var(--w-model);
  color: var(--ink-model);
  text-wrap: pretty;
  overflow-wrap: break-word;
  touch-action: pan-y pinch-zoom;
  -webkit-text-size-adjust: 100%;
}
/* a temporary spacer under the thread that keeps a flipped line in place when the new thread is shorter (anchor.js);
   it lives on module 2's own tail slot */
#tail-ghost { padding-bottom: var(--th-spacer, 0px); }
/* the warp: the chosen thread, down the gutter from the first knot to the end (solid), then the ghost (dashed) */
#thread::before {
  content: "";
  position: absolute;
  left: 8px;
  top: calc(var(--th-lh) / 2);
  height: calc(var(--th-gtop, 100%) - var(--th-lh) / 2);
  width: 2px;
  background: var(--warp-line);
  pointer-events: none;
}
#thread[data-empty="true"]::before { display: none; }
#thread[data-th-ghost="inline"]::after {
  content: "";
  position: absolute;
  left: 8px;
  top: var(--th-gtop, 100%);
  bottom: 2px;
  width: 0;
  border-left: 2px dashed var(--th-gdye, var(--dye-1));
  pointer-events: none;
}

.th-para {
  position: relative;          /* the containing block of its knots (and safe under content-visibility) */
  margin: 0 0 .7em;
  white-space: pre-line;       /* a single "\n" stays in the text node and breaks the line */
}
.th-para:last-child { margin-bottom: 0; }
.th-para:has(+ .th-selvage) { margin-bottom: 0; }
.th-cont { margin-top: 0; }
.th-void { display: none; }
/* long threads (§4.3): far paragraphs skip rendering while off screen. content-visibility implies paint containment,
   which clips to the paragraph's padding box, so the knot lane (and the knot's 44 px box above and below its line)
   moves inside the padding, with matching negative margins: nothing moves on screen. */
.th-far {
  --th-farpad: calc(var(--gutter) + 13px);
  content-visibility: auto;
  padding: 10px 0 10px var(--th-farpad);
  margin: -10px 0 calc(.7em - 10px) calc(-1 * var(--th-farpad));
}
.th-far.th-cont { margin-top: -10px; }
.th-far .th-knot { left: 0; }

.th-human { font-weight: var(--w-human); color: var(--ink); }
.th-model { font-weight: var(--w-model); color: var(--ink-model); }
.th-lead { white-space: nowrap; }

/* tick: exactly where a passage with alternatives begins (§4.4) */
.th-tick {
  display: inline-block;
  width: 2px;
  height: 1.1em;
  vertical-align: -0.2em;
  margin: 0 3px 0 1px;
  background: var(--seam);
}

/* focused passage: the indigo band (§4.3, D14) */
.th-p.is-focused {
  background: var(--band);
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  padding: 1px 0;
}

/* passage tags: Cut off · Length limit · Archived */
.th-tag {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 5px;
  font: 600 12px/1.1 var(--font-ui);
  color: var(--ink-muted);
  border: 1px solid var(--edge);
  border-radius: var(--r-0);
  vertical-align: 0.12em;
  white-space: nowrap;
  font-style: normal;
}

/* the weft caret: streaming in place (§4.3); steps at 1 Hz */
.th-caret {
  display: inline-block;
  width: 0.5em;
  height: 1.05em;
  margin-left: 2px;
  vertical-align: -0.18em;
  background: var(--weft);
  animation: th-blink 1s steps(1, end) infinite;
}
@keyframes th-blink { 50% { opacity: 0; } }

/* prompt window (§4.3, SHOULD) */
::highlight(th-outside) { color: var(--ink-muted); }
.th-window {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  margin: 0 0 var(--s-2);
  font: 600 12px/1.2 var(--font-ui);
  color: var(--ink-muted);
  font-style: normal;
}
.th-window::after { content: ""; flex: 1; border-top: 1px dashed var(--edge); }

/* edit fold (§7.1) */
.th-fold {
  margin: var(--s-3) 0 0;
  padding: var(--s-2) 0;
  border-top: 1px dashed var(--edge);
  font: 400 13px/1.3 var(--font-ui);
  color: var(--ink-muted);
}

/* ---------- knots (§4.4): 44 px buttons, placed with only `left` so they sit on the passage's first line ---------- */
.th-knot {
  --dye: var(--th-dye, var(--warp-line));   /* the lineage dye arrives inline as --th-dye (the lens overrides --dye) */
  position: absolute;
  left: calc(-1 * var(--gutter) - 13px);
  margin-top: calc((var(--th-lh) - var(--target)) / 2);
  width: var(--target);
  height: var(--target);
  display: inline-grid;        /* inline-level: its static position is the line where the passage begins */
  place-items: center;
  z-index: 1;
  padding: 0;
  border: 0;
  background: none;
  font: 700 12px/1 var(--font-num);
  font-style: normal;
  color: var(--ink);
  text-indent: 0;
  white-space: nowrap;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  border-radius: 50%;
}
.th-knot::before {
  content: "";
  position: absolute;
  left: 11px;
  top: 11px;
  width: 22px;
  height: 22px;
  box-sizing: border-box;
  border-radius: 50%;
  background: var(--paper);
  border: 2px solid var(--dye, var(--warp-line));
}
.th-kn { position: relative; font-variant-numeric: tabular-nums; }
.th-knot.is-bead::before { left: 17px; top: 17px; width: 10px; height: 10px; border-color: var(--warp-line); }
.th-knot.is-here::before { background: var(--weft); border: 1.5px solid var(--on-weft); }
.th-knot.is-here { color: var(--on-weft); }
.th-knot.is-bead.is-here::before { left: 15px; top: 15px; width: 14px; height: 14px; }
.th-knot.is-edited::before { background: linear-gradient(90deg, var(--dye, var(--warp-line)) 50%, var(--paper) 50%); }
.th-knot.is-edited.is-here::before { background: linear-gradient(90deg, var(--dye, var(--warp-line)) 50%, var(--weft) 50%); }
.th-knot.is-archived::before { border-style: dotted; }
.th-knot.is-open::after {
  content: "";
  position: absolute;
  left: 7px;
  top: 7px;
  width: 30px;
  height: 30px;
  box-sizing: border-box;
  border-radius: 50%;
  border: 2px solid var(--warp);
}
.th-knot.is-bead.is-open::after { left: 10px; top: 10px; width: 24px; height: 24px; }
.th-rib {
  position: absolute;
  left: 17.5px;
  top: 33px;
  width: 9px;
  height: 8px;
  background: var(--warp);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 62%, 0 100%);
}
.th-knot.is-bead .th-rib { top: 29px; }
.th-knot.is-cluster .th-kn { letter-spacing: -1px; }
/* a cluster head is always drawn as the full 22 px ring, even when its own passage is a bead (the root, an only child) */
.th-knot.is-cluster.is-bead::before { left: 11px; top: 11px; width: 22px; height: 22px; }
.th-knot.is-cluster.is-bead .th-rib { top: 33px; }
.th-knot:focus-visible { outline-offset: -4px; }
#app[data-lens="on"] #thread .th-knot, #app[data-lens="on"] #tail-ghost .th-knot { --dye: var(--ink-muted); }
#app[data-lens="on"] #thread .th-tick { background: var(--ink-muted); }
/* the ghost's dashed warp: its dye is set inline (per preview), so the neutral value needs !important */
#app[data-lens="on"] #thread, #app[data-lens="on"] #tail-ghost .th-gwrap { --th-gdye: var(--ink-muted) !important; }

/* the ghost's knot: a dashed ring in the child's dye */
.th-knot.th-k-ghost { color: var(--ghost); pointer-events: none; }
.th-knot.th-k-ghost::before { border-style: dashed; background: var(--paper); }

/* ---------- selvage bar (§4.5) ---------- */
.th-selvage {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  min-height: 56px;
  margin: var(--s-2) 0 var(--s-3) calc(-1 * var(--gutter));
  padding: 4px 2px;
  background: var(--band);
  border-top: 1.5px dashed var(--warp);
  border-bottom: 1.5px dashed var(--warp);
  font: 400 15px/1.2 var(--font-ui);
  font-style: normal;
  color: var(--ink);
  white-space: normal;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.th-sv-in { animation: th-fade var(--dur-2) var(--ease-out) both; }   /* opening only (§12), never on re-renders */
.th-pager { display: flex; align-items: center; flex: none; }
.th-sv-arrow { height: 48px; color: var(--ink); }
.th-sv-arrow.is-plus { color: var(--warp); }
.th-count {
  height: 48px;
  min-width: 66px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 6px;
  border-radius: var(--r-1);
  font: 600 15px/1 var(--font-num);
  color: var(--ink);
}
.th-count[aria-disabled="true"] { opacity: 1; cursor: default; }
.th-sep { flex: none; width: 1px; height: 28px; margin: 0 4px; background: var(--edge); }
.th-vb {
  flex: 1 1 60px;
  min-width: 60px;
  max-width: 96px;
  height: 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border-radius: var(--r-1);
  font: 600 12px/1 var(--font-ui);
  color: var(--ink);
}
.th-vb .ui-i { width: 20px; height: 20px; }
.th-vb-l { display: flex; align-items: center; justify-content: center; gap: 4px; min-width: 0; }
.th-vb[aria-pressed="true"] { color: var(--warp); }
.th-kbd { display: none; }
.th-sw { width: 18px; height: 12px; stroke-width: 2.4; flex: none; }
#app[data-lens="on"] :is(#thread, #tail-ghost) .th-sw { color: var(--ink-muted) !important; }
.th-svnote {
  position: absolute;
  bottom: calc(100% + 4px);
  z-index: 4;
  width: max-content;
  max-width: 160px;
  padding: 6px 10px;
  background: var(--ink);
  color: var(--paper);
  border-radius: var(--r-1);
  font: 600 13px/1.2 var(--font-ui);
  pointer-events: none;
}
@media (hover: hover) and (pointer: fine) {
  .th-sv-arrow:not([aria-disabled="true"]):hover, .th-count:not([aria-disabled="true"]):hover,
  .th-vb:not([aria-disabled="true"]):hover { background: color-mix(in oklch, var(--warp-tint) 70%, var(--band)); }
  .th-knot:not(.th-k-ghost):hover::before { box-shadow: 0 0 0 3px color-mix(in oklch, var(--warp-tint) 80%, transparent); }
}

/* key hints beside the labels whenever the pointer is fine (§3.6), in the inline bar and the margin note */
@media (hover: hover) and (pointer: fine) {
  .th-selvage .th-kbd {
    display: inline-block;
    min-width: 18px;
    padding: 1px 4px;
    border: 1px solid var(--edge);
    border-radius: var(--r-1);
    font: 600 12px/1.1 var(--font-num);
    color: var(--ink-muted);
    text-align: center;
  }
  .th-selvage:not(.th-note) .th-vb { max-width: 116px; }
}

/* margin note (≥ 1280 with a wide margin, §3.6): beside the passage, so focusing never reflows the prose */
.th-selvage.th-note {
  position: absolute;
  top: 0;
  right: calc(100% + var(--s-4));
  z-index: 3;
  width: 196px;
  margin: 0;
  padding: 4px;
  flex-direction: column;
  flex-wrap: nowrap;
  align-items: stretch;
  border-radius: 0 0 var(--r-1) var(--r-1);
}
.th-note .th-pager { justify-content: space-between; border-bottom: 1px solid var(--rule); padding-bottom: 2px; margin-bottom: 2px; }
.th-note .th-sep { display: none; }
.th-note .th-vb {
  flex: none;
  max-width: none;             /* the full width of the note (the inline bar's 96 px cap cut the row and its hint) */
  flex-direction: row;
  justify-content: flex-start;
  gap: 10px;
  height: 44px;
  padding: 0 10px;
  font-size: 15px;
}
.th-note .th-vb-l { flex: 1; justify-content: space-between; gap: 10px; }
.th-note .th-vb .th-vb-t { flex: 1; text-align: left; }
@media (hover: hover) and (pointer: fine) {
  .th-note .th-kbd { min-width: 20px; padding: 2px 5px; line-height: 1; }
}
/* never taller than the reader (TH-2): a very short reader scrolls the note's own list */
.th-selvage.th-note.th-note-tight { max-height: var(--th-note-max, none); overflow-y: auto; }

/* ---------- swipe feedback (§4.6) ---------- */
/* V-11: a passage that starts or ends mid-line shares that line with its neighbour. Sliding, its text covers what
   it passes over (opaque paper, above the dimmed text below) instead of drawing two passages' words on top of each
   other. The band of a focused passage stays, on paper (a transparent --band under more contrast or forced colours).
   The knots stay above the moving text (the gutter label is z-index 3). */
.th-p.th-dragging {
  position: relative;
  z-index: 1;
  background-color: var(--paper);
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
.th-p.th-dragging.is-focused { background-image: linear-gradient(var(--band), var(--band)); }
/* the gutter stays put while the text slides under it: the knots, the warp line and the ghost's dashed warp, and an
   open bar over the warp */
#thread.th-swiping .th-knot,
#thread.th-swiping::before,
#thread.th-swiping::after { z-index: 2; }
#thread.th-swiping .th-selvage:not(.th-note) { z-index: 2; }
.th-p.th-return { transition: left var(--dur-2) var(--ease-out); }
.th-dim { opacity: .6; transition: opacity var(--dur-1) var(--ease-out); }
.th-fliplabel {
  position: absolute;
  z-index: 3;
  transform: translateY(-50%);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 10px;
  background: var(--paper-lift);
  border: 1px solid var(--edge);
  border-radius: var(--r-1);
  font: 600 13px/1 var(--font-ui);
  font-style: normal;
  color: var(--ink);
  white-space: nowrap;
  pointer-events: none;
}
.th-fliplabel.is-next { right: 0; }
.th-fliplabel.is-prev { left: 0; }
.th-fliplabel.is-armed { border: 2px solid var(--warp); color: var(--warp); padding: 0 9px; }
.th-fliplabel .num { font-family: var(--font-num); }

.th-enter-next, .th-enter-prev { position: relative; animation: th-in-next var(--dur-2) var(--ease-out) both; }
.th-enter-prev { animation-name: th-in-prev; }
.th-enter-fade { animation: th-fade var(--dur-2) var(--ease-out) both; }
@keyframes th-in-next { from { left: 24px; opacity: 0; } to { left: 0; opacity: 1; } }
@keyframes th-in-prev { from { left: -24px; opacity: 0; } to { left: 0; opacity: 1; } }
@keyframes th-fade { from { opacity: 0; } to { opacity: 1; } }

/* ---------- ghost preview (§4.7) ---------- */
.th-ghost, .th-gp {
  font-style: italic;
  font-weight: var(--w-model);
  color: var(--ghost);
  -webkit-user-select: none;
  user-select: none;
}
.th-tail { font-family: var(--font-story); }
.th-gwrap {
  position: relative;
  padding-left: var(--gutter);
  margin-top: .7em;
  font-size: var(--story-size);
  line-height: var(--story-lh);
  --th-lh: calc(var(--story-size) * var(--story-lh));
}
.th-gwrap::before {
  content: "";
  position: absolute;
  left: 8px;
  top: 4px;
  bottom: 4px;
  border-left: 2px dashed var(--th-gdye, var(--dye-1));
}
.th-gp { margin: 0 0 .7em; }
.th-gp:last-child { margin-bottom: 0; }
.th-gcap {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s-1) var(--s-3);
  margin: var(--s-2) 0 0 var(--gutter);
  font: 400 13px/1.3 var(--font-ui);
  color: var(--ink-muted);
}
.th-gcap-t { display: flex; align-items: center; gap: var(--s-2); min-height: 24px; }
.th-gcap .num { font-family: var(--font-num); }
.th-readend { min-height: var(--target); padding: 0 var(--s-3); font-size: 15px; }
.th-readend .ui-i { width: 18px; height: 18px; }

/* ---------- cluster chooser ---------- */
.th-chooser { display: flex; flex-direction: column; padding: 0 0 var(--s-2); }
.th-choice {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  min-height: 52px;
  padding: 0 var(--s-4);
  border-top: 1px solid var(--rule);
  text-align: left;
  color: var(--ink);
}
.th-choice-ix { flex: none; display: flex; align-items: center; gap: 6px; font: 600 13px/1 var(--font-num); }
.th-choice-t { flex: 1; min-width: 0; font: 400 15px/1.35 var(--font-story); color: var(--ink-model); }

/* ---------- the column at each width (§3) ---------- */
@media (min-width: 768px) and (min-height: 501px) {
  #thread, #thread-tail { margin-left: calc(72px - var(--side)); }
}
@media (min-width: 1280px) and (min-height: 501px) {
  #thread, #thread-tail {
    max-width: calc(var(--ui-col) - 2 * var(--side));
    margin-left: auto;
    margin-right: auto;
  }
}

/* ---------- reduced motion (§12): opacity only ---------- */
@media (prefers-reduced-motion: reduce) {
  .th-caret { animation: none; }
  .th-enter-next, .th-enter-prev { animation: th-fade var(--dur-1) linear both; }
  .th-enter-fade, .th-sv-in { animation-duration: var(--dur-1); }
  .th-p.th-return { transition-duration: 0ms; }
}

/* ---------- §13.8 more contrast ---------- */
@media (prefers-contrast: more) {
  #thread::before { width: 3px; }
  .th-tick { width: 3px; }
  .th-p.is-focused { outline: 2px solid var(--ink); outline-offset: 1px; }
  .th-selvage { border-top-width: 2px; border-bottom-width: 2px; }
}

/* ---------- §13.9 forced colors ---------- */
@media (forced-colors: active) {
  #thread::before { background: CanvasText; }
  .th-tick { background: CanvasText; }
  .th-knot::before { border-color: CanvasText !important; background: Canvas !important; }
  /* the cursor knot: a Highlight ring, not a fill. Chromium paints text on a Canvas backplate, so a HighlightText
     digit on a Highlight fill would draw as HighlightText on Canvas and vanish (TH-4); the digit stays CanvasText */
  .th-knot.is-here::before { background: Canvas !important; border: 3px solid Highlight !important; }
  .th-knot.is-here { color: CanvasText; }
  .th-p.is-focused { outline: 2px solid Highlight; }
  .th-selvage { border-color: CanvasText; }
  .th-rib { background: CanvasText; }
}

/* 20-deck.css */
/* Deck strip, preview card, action bar, deck rows and the practice note (module 3), spec §4.8, §4.10, §3.2–3.6.
   Visibility of #deck / #actionbar as a whole is module 1's (02-shell.css); this file styles inside them. */

/* ---------- #deck ---------- */
.dk-deck { display: flex; flex-direction: column; min-width: 0; }
.dk-deck [hidden] { display: none !important; }

/* ---------- strip: Branches + chips (§4.8) ---------- */
.dk-strip {
  flex: none;
  height: var(--strip-h);
  display: flex;
  align-items: center;
  gap: var(--s-2);
  padding-left: var(--s-2);
  min-width: 0;
}
.dk-all {
  flex: none;
  width: 64px;
  height: 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border-radius: var(--r-1);
  color: var(--ink);
}
.dk-n { display: flex; align-items: center; gap: 2px; font: 600 18px/1 var(--font-num); }
.dk-n .ui-i { width: 14px; height: 14px; stroke-width: 2.2; }
.dk-l { font: 600 12px/1 var(--font-ui); color: var(--ink-muted); }

.dk-chips {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  gap: var(--s-2);
  margin-right: var(--edge-safe);         /* the scroller ends 32 px from the screen edge (§4.6 edge zones) */
  padding: 4px 0;
  overflow-x: auto;
  overflow-y: hidden;
  overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.dk-chips::-webkit-scrollbar { display: none; }

.dk-chip {
  flex: 0 0 200px;
  height: 50px;
  display: flex;
  align-items: center;
  gap: var(--s-2);
  padding: 0 var(--s-2);
  background: var(--paper-lift);
  border: 1px solid var(--edge);
  border-radius: var(--r-0);
  color: var(--ink);
  text-align: left;
  scroll-snap-align: start;
  scroll-snap-stop: always;
}
.dk-chip[aria-selected="true"] { border: 2px solid var(--warp); padding: 0 7px; }
.dk-chip:focus-visible { outline-offset: -4px; box-shadow: none; }
.dk-ix {
  flex: none;
  width: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font: 600 13px/1 var(--font-num);
  color: var(--ink);
}
.ui-i.dk-sw { width: 18px; height: 12px; stroke: var(--dk-dye, var(--dye-1)); stroke-width: 2.4; }
.ui-i.dk-sw.dk-dash { stroke-dasharray: 2.5 3; }
.dk-sn {
  flex: 1 1 auto;
  min-width: 0;
  font: 400 13px/1.3 var(--font-ui);
  color: var(--ink-model);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}
.dk-cues {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--warp);
}
.dk-cue { display: flex; align-items: center; gap: 1px; font: 600 12px/1 var(--font-num); }
.dk-cue .ui-i { width: 16px; height: 16px; }
.dk-mark .ui-i { fill: currentColor; }
.dk-like { max-width: 54px; font: 600 12px/1.15 var(--font-ui); color: var(--ink-muted); text-align: center; }
/* a passage with no text (imported Loom files have them) says so (DK-16) */
.dk-empty, .dk-sn.dk-empty { font-style: italic; color: var(--ink-muted); }
.dk-udot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warp); flex: none; }

.dk-one {
  flex: 0 0 auto;
  justify-content: center;
  gap: 6px;
  padding: 0 14px;
  background: transparent;
  border: 1px dashed var(--edge);
  font: 600 13px/1 var(--font-ui);
  color: var(--ink);
}
.dk-one .ui-i { width: 18px; height: 18px; }

.dk-leaf {
  flex: 1 1 auto;
  min-width: 0;
  padding-right: var(--s-4);
  font: 400 13px/1.35 var(--font-ui);
  color: var(--ink-muted);
}

/* ---------- preview card: the previewed child, with Follow ---------- */
.dk-card {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--s-1);
  min-height: 52px;
  padding: 4px var(--s-2) 4px var(--s-4);
  border-top: 1px solid var(--rule);
}
.dk-card-tx {
  flex: 1 1 auto;
  min-width: 0;
  font: 400 14px/1.32 var(--font-story);
  color: var(--ink-model);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}
.dk-join { font-style: italic; color: var(--ink-muted); }
.dk-card-acts { flex: none; display: flex; align-items: center; gap: 0; }
.dk-card-b { color: var(--ink); }
.dk-follow { margin-left: var(--s-1); padding: 0 var(--s-4); }

/* ---------- one-line rows above the strip (§5.4, §5.5) ---------- */
.dk-row {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--s-2);
  min-height: 36px;
  padding: 0 4px 0 var(--s-4);
  border-bottom: 1px solid var(--rule);
  font: 500 13px/1.3 var(--font-ui);
  color: var(--ink-muted);
}
.dk-row-t { flex: 1 1 auto; min-width: 0; padding: 6px 0; }
.dk-row-t .num { color: var(--ink); }
.dk-row-t i { font-style: italic; }
.dk-row-t .ui-i { width: 18px; height: 18px; vertical-align: -4px; margin-right: 6px; }
.dk-row-acts { flex: none; display: flex; align-items: center; }
.dk-row-b {
  min-height: var(--target);
  margin: -4px 0;
  padding: 0 10px;
  border-radius: var(--r-1);
  font: 600 13px/1 var(--font-ui);
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.dk-row[data-kind="inplace"] { color: var(--ink); }

/* ---------- practice note in #dock-note-practice (§5.3) ---------- */
.dk-note {
  display: flex;
  align-items: center;
  gap: var(--s-1);
  padding: 4px 4px 4px var(--s-4);
  border-bottom: 1px solid var(--rule);
  font: 400 13px/1.35 var(--font-ui);
  color: var(--ink);
}
.dk-note-t { flex: 1 1 auto; min-width: 0; padding: 6px 0; }
.dk-note-t b { font-weight: 700; }
.dk-note-acts { flex: none; display: flex; align-items: center; }
.dk-note-why {
  min-height: var(--target);
  padding: 0 8px;
  border-radius: var(--r-1);
  font: 600 13px/1 var(--font-ui);
  color: var(--warp);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.dk-note-x .ui-i { width: 18px; height: 18px; }
/* static page, no key yet: "Add key" opens Settings at the OpenRouter key; it never breaks across lines */
.dk-note-key { white-space: nowrap; }

/* ---------- action bar (§4.10) ---------- */
.dk-act {
  flex: none;
  height: var(--actbar-h);
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 var(--s-3) 0 4px;
  min-width: 0;
}
.dk-tb {
  flex: none;
  width: 52px;
  height: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border-radius: var(--r-1);
  font: 600 12px/1 var(--font-ui);
  color: var(--ink);
}
.dk-gap { flex: 1 1 auto; min-width: 0; }
.dk-set {
  flex: none;
  width: 90px;
  height: 52px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  padding: 0 9px;
  background: var(--paper-lift);
  border: 1px solid var(--edge);
  border-radius: var(--r-1);
  font: 600 12px/1 var(--font-ui);
  color: var(--ink);
  text-align: left;
  white-space: nowrap;
}
.dk-set b { font-weight: 600; }
.dk-weave, .dk-stop {
  flex: none;
  height: 52px;
  display: flex;
  align-items: center;
  border-radius: var(--r-1);
  margin-left: 6px;
  text-align: left;
}
.dk-weave {
  min-width: 116px;
  gap: 7px;
  padding: 0 12px 0 8px;
  background: var(--warp-fill);
  color: var(--on-warp);
}
.dk-weave:focus-visible, .dk-stop:focus-visible { outline-offset: 2px; }
.dk-shuttle { width: 28px; height: 22px; flex: none; }
.dk-wl { display: flex; flex-direction: column; min-width: 0; }
.dk-w1 { font: 700 17px/1 var(--font-ui); }
.dk-w2 { font: 500 12px/1 var(--font-ui); margin-top: 4px; white-space: nowrap; }
.dk-stop {
  min-width: calc(90px + 6px + 116px);   /* Stop takes the settings chip's place and width (§4.10) */
  gap: 10px;
  padding: 0 14px 0 14px;
  background: var(--paper-lift);
  color: var(--ink);
  border: 2px solid var(--ink);
}
.dk-stop .ui-i { width: 16px; height: 16px; fill: currentColor; stroke: none; }
.dk-stop .dk-w2 { color: var(--ink-muted); }

@media (hover: hover) and (pointer: fine) {
  .dk-tb:not([aria-disabled="true"]):hover, .dk-all:not(:disabled):hover, .dk-row-b:hover, .dk-note-why:hover,
  .dk-one:hover { background-color: color-mix(in oklch, var(--warp-tint) 60%, transparent); }
  .dk-set:hover, .dk-chip[role="option"]:hover { background-color: color-mix(in oklch, var(--warp-tint) 45%, var(--paper-lift)); }
  .dk-weave:hover { background: color-mix(in oklch, var(--warp-fill) 88%, var(--ink)); }
}

/* ---------- narrow phones (360, 320, or 393 at high zoom): the bar's 3 × 52 + 90 + 116 needs ~394 px, so the
   items give up their spare width; targets stay ≥ 44 px and Weave / Stop stay on screen (§3.3 small Android) ---------- */
@media (max-width: 380px) {
  .dk-act { gap: 0; padding: 0 8px 0 2px; }
  .dk-tb { width: 46px; }
  .dk-set { width: auto; padding: 0 7px; }
  .dk-weave { min-width: 0; gap: 5px; padding: 0 10px 0 6px; margin-left: 4px; }
  .dk-shuttle { width: 24px; height: 19px; }
  .dk-stop { min-width: 0; flex: 0 1 auto; gap: 8px; padding: 0 10px; margin-left: 4px; }
}
@media (max-width: 340px) {
  .dk-weave .dk-shuttle { display: none; }   /* decorative; the label carries the action */
  .dk-weave { padding: 0 10px; }
}
/* 393 px at 200 % zoom is 197 CSS px (§13.11): the action bar labels hide (the names remain), the chip keeps only
   "4 ×", Weave and Stop keep one line. Five items cannot each keep 44 CSS px here; at this zoom a 30 px button is
   still 60 px on the glass (WCAG 2.5.8 asks for 24). */
@media (max-width: 260px) {
  .dk-act { gap: 0; padding: 0 4px 0 2px; }
  .dk-tb { flex: 1 1 32px; width: auto; min-width: 28px; }
  .dk-tb .dk-tl { display: none; }
  .dk-gap { flex: 0 0 0; }
  .dk-set { flex: none; padding: 0 5px; margin-left: 2px; }
  .dk-set1 > span:not(.dk-set-n), .dk-set2 { display: none; }
  .dk-weave, .dk-stop { flex: none; min-width: 0; padding: 0 8px; margin-left: 4px; gap: 6px; }
  .dk-weave .dk-w2, .dk-stop .dk-w2 { display: none; }
  .dk-w1 { font-size: 15px; }
}
@media (max-width: 200px) {   /* 360 px at 200 % */
  .dk-act { padding: 0 2px 0 0; }
  .dk-weave, .dk-stop { padding: 0 6px; margin-left: 2px; }
}

/* ---------- key hints (§3.6): printed beside labels with a keyboard and a fine pointer, on wide layouts only ---------- */
.dk-kbd { display: none; }
@media (hover: hover) and (pointer: fine) and (min-width: 768px) and (min-height: 501px) {
  .dk-kbd {
    display: inline-block;
    flex: none;
    min-width: 18px;
    margin-left: 6px;
    padding: 2px 4px;
    border: 1px solid var(--edge);
    border-radius: var(--r-1);
    font: 600 11.5px/1 var(--font-num);
    color: var(--ink-muted);
    text-align: center;
  }
  .dk-tb .dk-kbd { margin-left: 0; }
  .dk-weave .dk-kbd, .dk-follow .dk-kbd, .dk-a-follow .dk-kbd {
    border-color: color-mix(in oklch, var(--on-warp) 55%, transparent);
    color: var(--on-warp);
    margin-left: 8px;
  }
  .dk-stop .dk-kbd { margin-left: 4px; }
  /* ↵ on Follow promises "Enter follows the preview": while a control whose Enter is its own has focus (a knot, the
     Library button, another lane button), the hint steps back without moving anything (deck.js data-enter, V-8) */
  .dk-deck[data-enter="own"] .dk-follow .dk-kbd,
  .dk-deck[data-enter="own"] .dk-a-follow .dk-kbd { visibility: hidden; }
}

/* ---------- small heights: the strip keeps its 64 px; nothing here changes height from above ---------- */

/* ---------- landscape phone (§3.4): the deck is a 300 px column, the bar a 64 px vertical strip ---------- */
@media (orientation: landscape) and (max-height: 500px) {
  .dk-strip { height: auto; flex-direction: column; align-items: stretch; padding: var(--s-2); gap: var(--s-2); }
  .dk-all { width: auto; height: var(--target); flex-direction: row; justify-content: flex-start; gap: var(--s-2); padding: 0 var(--s-2); }
  .dk-chips { flex-direction: column; margin-right: 0; overflow-x: hidden; overflow-y: visible; scroll-snap-type: none; padding: 0; }
  .dk-chip { flex: none; height: auto; min-height: 50px; padding-block: 6px; }
  .dk-sn { -webkit-line-clamp: 3; }
  .dk-one { min-height: var(--target); }
  .dk-act { height: 100%; flex-direction: column; justify-content: flex-start; padding: 4px 6px; gap: 2px; }
  .dk-tb { width: 52px; height: 50px; }
  .dk-gap { flex: 1 1 auto; min-height: 0; }
  .dk-set { width: 52px; height: 52px; padding: 0 2px; align-items: center; text-align: center; font-size: 11.5px; }
  .dk-set1 { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .dk-set2 { display: none; }
  .dk-weave, .dk-stop { margin: 4px 0 0; width: 52px; min-width: 0; height: 56px; padding: 0; flex-direction: column; justify-content: center; gap: 2px; }
  .dk-weave .dk-w2, .dk-stop .dk-w2 { display: none; }
  .dk-w1 { font-size: 13px; }
}

/* ---------- tablet and desktop (§3.5, §3.6) ---------- */
@media (min-width: 768px) and (min-height: 501px) {
  .dk-tb { width: auto; flex-direction: row; gap: 6px; padding: 0 12px; font: 600 15px/1 var(--font-ui); height: 52px; }
  .dk-set { width: auto; flex-direction: row; align-items: center; gap: 0; padding: 0 12px; font-size: 13px; }
  .dk-set2::before { content: "\00a0·\00a0"; }
  .dk-weave { padding: 0 16px 0 12px; }
  .dk-weave .dk-wl { flex-direction: row; align-items: baseline; gap: 8px; }
  .dk-weave .dk-w2 { margin-top: 0; font-size: 13px; }
  .dk-stop .dk-wl { flex-direction: row; align-items: baseline; gap: 8px; }
  .dk-stop .dk-w2 { margin-top: 0; font-size: 13px; }
  .dk-stop { min-width: 0; }
  .dk-card { padding-left: 80px; }   /* aligned with the chips */
}

/* ---------- §13.8 / §13.9 ---------- */
@media (prefers-contrast: more) {
  .dk-chip, .dk-set { border-width: 2px; }
  .dk-chip { padding: 0 7px; }
  .dk-card, .dk-row, .dk-note { border-color: var(--edge); }
}
@media (forced-colors: active) {
  .dk-chip, .dk-set, .dk-stop, .dk-weave, .dk-one { border: 1px solid CanvasText; }
  .dk-kbd { border-color: CanvasText; color: CanvasText; }
  .dk-chip[aria-selected="true"] { border: 2px solid Highlight; }
  .ui-i.dk-sw { stroke: CanvasText; }
  .dk-udot { background: CanvasText; }
}

/* 21-weave.css */
/* Shed, lanes, error panel, thread-tail shuttle line and the Weave settings sheet (module 3), spec §4.9, §4.11,
   §5.3, §12. */

/* ---------- the shed (§4.9) ---------- */
.dk-deck[data-state="shed"] {
  /* never more than 62% of the space between the top bar and the action bar (§3.3), counting the dock's other rows
     (notes, fork map, selection bar: --dk-extra, measured by deck.js); lanes scroll inside. The floor keeps the head
     and one lane. */
  --dk-cap: max(132px, calc((var(--vvh, 100dvh) - var(--topbar-h) - env(safe-area-inset-top, 0px) - var(--actbar-h)
    - max(var(--s-2), env(safe-area-inset-bottom, 0px)) - var(--kb, 0px)) * 0.62 - var(--dk-extra, 0px)));
  max-height: var(--dk-cap);
  min-height: 0;
  flex: 0 1 auto;
}
.dk-shed { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
.dk-shed-head {
  flex: none;
  display: flex;
  align-items: center;
  gap: 0 var(--s-2);
  padding: 6px 4px 8px var(--s-4);
}
.dk-heads { flex: 1 1 auto; min-width: 0; }
.dk-s1 { font: 700 15px/1.25 var(--font-ui); color: var(--ink); }
.dk-s2 { margin-top: 2px; font: 400 13px/1.3 var(--font-ui); color: var(--ink-muted); }
.dk-s2 .num { color: var(--ink); }
.dk-gen {
  flex: none;
  display: flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  max-width: 46%;
  padding: 0 8px;
  border: 1px solid var(--edge);
  font: 600 12px/1 var(--font-ui);
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dk-gen[data-kind="practice"] {
  border: 2px solid transparent;
  padding: 0 7px;
  background:
    linear-gradient(var(--paper-sunk), var(--paper-sunk)) padding-box,
    repeating-linear-gradient(45deg, var(--edge) 0 2px, transparent 2px 5px) border-box;
}
.dk-hide { color: var(--ink); }

.dk-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  border-top: 1px solid var(--edge);
}
.dk-lanes { list-style: none; margin: 0; padding: 0; }

/* ---------- a lane ---------- */
.dk-lane { background: var(--paper); border-top: 1px solid var(--rule); }
.dk-lane:first-child { border-top: 0; }
.dk-lane[aria-current="true"] { background: var(--band); }
.dk-pick {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  gap: 0 10px;
  width: 100%;
  padding: 9px var(--s-4) 9px 14px;
  text-align: left;
  color: var(--ink);
}
.dk-pick:focus-visible { outline-offset: -3px; box-shadow: none; }
.dk-pick .dk-ix { width: 22px; padding-top: 3px; gap: 4px; }
.dk-body { display: block; min-width: 0; }
.dk-tx {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font: 400 15px/1.42 var(--font-story);
  color: var(--ink-model);
  overflow-wrap: anywhere;
}
.dk-lane[aria-current="true"] .dk-tx { -webkit-line-clamp: 4; }
/* streaming lanes show their newest lines, older lines masked off the top */
.dk-tx.dk-tail {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;            /* reads from the top until it overflows, then shows its newest lines */
  max-height: calc(2em * 1.42);
  -webkit-line-clamp: unset;
}
.dk-tx.dk-tail.dk-over {
  justify-content: flex-end;
  -webkit-mask-image: linear-gradient(transparent, #000 0.8em);
  mask-image: linear-gradient(transparent, #000 0.8em);
}
.dk-lane[aria-current="true"] .dk-tx.dk-tail { max-height: calc(4em * 1.42); }
.dk-tx.dk-tail > .dk-tx-in { display: block; }
.dk-caret {
  display: inline-block;
  width: 0.45em;
  height: 1em;
  margin-left: 2px;
  vertical-align: -0.14em;
  background: var(--weft);
  animation: dk-blink 1s steps(1, end) infinite;
}
@keyframes dk-blink { 50% { opacity: 0; } }
/* the skeleton is exactly as tall as the 2 lines of text that replace it (DK-12) */
.dk-sk { display: block; height: calc(2 * 1.42 * 15px); overflow: hidden; }
.dk-sk i { display: block; box-sizing: border-box; height: calc(1.42 * 15px - 10px); margin: 5px 0; border-bottom: 2px dashed var(--edge); }

.dk-st { display: block; margin-top: 4px; font: 500 13px/1.3 var(--font-ui); color: var(--ink-muted); }
.dk-st b { font-weight: 600; color: var(--ink); }
.dk-st .num { font-size: 12.5px; }
.ui-i.dk-st-i { width: 15px; height: 15px; stroke-width: 2.2; vertical-align: -3px; margin-right: 5px; }
.ui-i.dk-ok { color: var(--ok); }
.ui-i.dk-bad { color: var(--danger); }
.ui-i.dk-stopi { fill: currentColor; stroke: none; width: 12px; height: 12px; vertical-align: -1px; }
.dk-lane[data-state="failed"] .dk-st { color: var(--ink); }
.dk-lane[data-state="failed"] .dk-st b { color: var(--danger); }

.dk-c { white-space: nowrap; }
.dk-c .dk-udot { margin-right: 5px; vertical-align: 1px; }
.ui-i.dk-c-i { width: 14px; height: 14px; vertical-align: -2px; margin-right: 3px; color: var(--warp); fill: currentColor; }
.dk-nw { white-space: nowrap; }   /* " · New": never split, never alone on a line (V-21) */
.dk-new {
  display: inline-block;
  padding: 0 5px;
  border: 1px solid var(--warp);
  font: 700 12px/1.2 var(--font-ui);
  color: var(--warp);
}

.dk-bar { display: block; height: 4px; margin-top: 6px; background: var(--rule); }
.dk-bar > i { display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: var(--warp); }
.dk-bar.dk-off { visibility: hidden; }   /* keeps its place while the weave runs */

/* While a weave streams into the shed, nothing in a lane changes height (DK-12, §12 "the reading text does not move"):
   the text holds its clamp from the first frame, the bar keeps its place, the state row stays one line, and the
   frayed edge waits for the end. */
.dk-shed[data-running="true"] .dk-tx { min-height: calc(2em * 1.42); }
.dk-shed[data-running="true"] .dk-lane[aria-current="true"] .dk-tx { min-height: calc(4em * 1.42); }
.dk-shed[data-running="true"] .dk-st,
.dk-shed[data-running="true"] .dk-s2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* cut off: a frayed bottom edge (§5.3), once the weave has ended */
.dk-shed:not([data-running="true"]) .dk-lane[data-state="cutoff"] .dk-tx {
  -webkit-mask-image: linear-gradient(#000 calc(100% - 4px), transparent 0), conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg);
  -webkit-mask-size: 100% 100%, 8px 4px;
  -webkit-mask-position: 0 0, 0 100%;
  -webkit-mask-repeat: no-repeat, repeat-x;
  mask-image: linear-gradient(#000 calc(100% - 4px), transparent 0), conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg);
  mask-size: 100% 100%, 8px 4px;
  mask-position: 0 0, 0 100%;
  mask-repeat: no-repeat, repeat-x;
  padding-bottom: 4px;
}

/* The lane's actions: Follow · Follow and weave · More. Every label is always read in full (V-2, V-19): the layout is
   chosen by the lane's own width (a lane is a 300 px column in landscape, half the deck on a tablet, 197 px at 200 %
   zoom), never by clipping.
     ≥ 380 px   one row, roomy
     340–379    one row, tighter padding
     312–339    one row, the label shortens to "Follow + weave" (320 px phone: More stays on the row, DK-11)
     < 312      two rows: Follow and More, then Follow and weave on its own row
   The button's name stays "Follow branch k and weave from it" (aria-label) at every width. Safety net for a wider
   fallback font: the one-row layouts do not wrap (a wrap would drop More onto a row of its own); Follow and weave
   shrinks instead and its label breaks onto two lines inside the button, so nothing is cut. */
.dk-lane { container: dk-lane / inline-size; }
.dk-acts {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: var(--s-2);
  padding: 0 var(--s-2) 10px 46px;
}
.dk-a-follow { flex: none; padding: 0 var(--s-5); }
.dk-a-fw { flex: 0 1 auto; padding: 0 var(--s-3); white-space: normal; text-align: center; }
.dk-fw-s { display: none; }
.dk-a-more { flex: none; color: var(--ink); }
@container dk-lane (max-width: 379.98px) {
  .dk-acts { gap: 6px; padding-left: 40px; }
  .dk-a-follow { padding: 0 var(--s-4); }
  .dk-a-fw { padding: 0 10px; }
}
@container dk-lane (max-width: 339.98px) {
  .dk-fw-l { display: none; }
  .dk-fw-s { display: inline; }
}
@container dk-lane (max-width: 311.98px) {
  .dk-acts {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: "f . m" "w w w";
    gap: var(--s-2) 6px;
    justify-items: start;
  }
  .dk-a-follow { grid-area: f; }
  .dk-a-more { grid-area: m; }
  .dk-a-fw { grid-area: w; max-width: 100%; }
  .dk-fw-l { display: inline; }
  .dk-fw-s { display: none; }
}
/* With a fine pointer on a wide layout, Follow also prints its ↵ key hint (20-deck.css), about 34 px more: each step
   comes that much sooner (a 384 px tablet lane would otherwise push More onto a row of its own) */
@media (hover: hover) and (pointer: fine) and (min-width: 768px) and (min-height: 501px) {
  @container dk-lane (max-width: 409.98px) {
    .dk-acts { gap: 6px; padding-left: 40px; }
    .dk-a-follow { padding: 0 var(--s-4); }
    .dk-a-fw { padding: 0 10px; }
  }
  @container dk-lane (max-width: 373.98px) {
    .dk-fw-l { display: none; }
    .dk-fw-s { display: inline; }
  }
  @container dk-lane (max-width: 355.98px) {
    .dk-acts {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      grid-template-areas: "f . m" "w w w";
      gap: var(--s-2) 6px;
      justify-items: start;
    }
    .dk-a-follow { grid-area: f; }
    .dk-a-more { grid-area: m; }
    .dk-a-fw { grid-area: w; max-width: 100%; }
    .dk-fw-l { display: inline; }
    .dk-fw-s { display: none; }
  }
}
/* 200 % zoom (393 → 197, 360 → 180): the row starts under the lane number, and the short label is used */
@container dk-lane (max-width: 239.98px) {
  .dk-acts { padding-left: 14px; }
  .dk-fw-l { display: none; }
  .dk-fw-s { display: inline; }
}

/* ---------- summary row: "1 branch didn't arrive." ---------- */
.dk-sum {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s-2) var(--s-3);
  padding: 10px var(--s-4) 12px;
  border-top: 1px solid var(--rule);
  background: var(--paper-sunk);
}
.dk-sum-t { flex: 1 1 220px; display: flex; gap: var(--s-2); font: 400 13px/1.35 var(--font-ui); color: var(--ink); }
.dk-sum-t b { font-weight: 700; }
.dk-sum-t .ui-i { width: 18px; height: 18px; flex: none; margin-top: -1px; }

/* ---------- error panel (§5.3, §14.4) ---------- */
.dk-errbox:empty { display: none; }
.dk-err {
  padding: 12px var(--s-4) 14px;
  border-top: 1px solid var(--edge);
  background: var(--paper-lift);
}
.dk-err-t { display: flex; gap: var(--s-2); font: 500 15px/1.4 var(--font-ui); color: var(--ink); }
.dk-err-t .ui-i { width: 20px; height: 20px; flex: none; color: var(--danger); margin-top: 1px; }
.dk-err-field { display: grid; gap: 4px; margin-top: 10px; }
.dk-err-lab { font: 600 13px/1.2 var(--font-ui); color: var(--ink-muted); }
.dk-err-in {
  height: var(--target);
  padding: 0 12px;
  border: 1.5px solid var(--edge);
  border-radius: var(--r-1);
  background: var(--paper);
  color: var(--ink);
  font-size: 16px;
}
.dk-err-acts { display: flex; flex-wrap: wrap; gap: var(--s-2); margin-top: 12px; }

/* one-line lanes when the reader would keep fewer than 6 lines (§3.3) */
@media (max-height: 560px) {
  .dk-tx { -webkit-line-clamp: 1; }
  .dk-tx.dk-tail { max-height: calc(1em * 1.42); }
  .dk-tx.dk-tail.dk-over { -webkit-mask-image: none; mask-image: none; }
  .dk-lane[aria-current="true"] .dk-tx { -webkit-line-clamp: 2; }
  .dk-lane[aria-current="true"] .dk-tx.dk-tail { max-height: calc(2em * 1.42); }
  .dk-pick { padding-block: 6px; }
  .dk-sk { height: calc(1.42 * 15px); }
  .dk-sk i + i { display: none; }
  .dk-shed[data-running="true"] .dk-tx { min-height: calc(1em * 1.42); }
  .dk-shed[data-running="true"] .dk-lane[aria-current="true"] .dk-tx { min-height: calc(2em * 1.42); }
}

/* ≥ 768: lanes in a 2-column grid, 3 lines each (§3.5) */
@media (min-width: 768px) and (min-height: 501px) {
  .dk-lanes { display: grid; grid-template-columns: 1fr 1fr; }
  .dk-lane { border-top: 1px solid var(--rule); }
  .dk-lane:nth-child(2) { border-top: 0; }
  .dk-lane:nth-child(even) { border-left: 1px solid var(--rule); }
  .dk-tx { -webkit-line-clamp: 3; }
  .dk-tx.dk-tail { max-height: calc(3em * 1.42); }
  .dk-sk { height: calc(3 * 1.42 * 15px); }
  .dk-shed[data-running="true"] .dk-tx { min-height: calc(3em * 1.42); }
}
/* landscape phone: the shed is the same 300 px column, scrolling (§3.4) */
@media (orientation: landscape) and (max-height: 500px) {
  .dk-deck[data-state="shed"] { max-height: none; }
  .dk-gen { display: none; }
  .dk-tx { -webkit-line-clamp: 3; }
  .dk-tx.dk-tail { max-height: calc(3em * 1.42); }
  .dk-sk { height: calc(3 * 1.42 * 15px); }
  .dk-shed[data-running="true"] .dk-tx { min-height: calc(3em * 1.42); }
}

/* ---------- thread tail: the shuttle line (§5.3, §12) ---------- */
.dk-tailw { padding: 6px 0 4px; }
.dk-shut { position: relative; height: 22px; }
.dk-shut-line {
  position: absolute;
  left: 8px;
  right: 30px;
  top: 10px;
  height: 2px;
  background: var(--weft);
  transform-origin: left center;
  animation: dk-pass 280ms var(--ease-shuttle) both;
}
.dk-shut-g { position: absolute; top: 0; right: 0; width: 32px; height: 22px; animation: dk-ride 280ms var(--ease-shuttle) both; }
.dk-shut-g svg { display: block; width: 32px; height: 22px; }
@keyframes dk-pass { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes dk-ride { from { right: calc(100% - 40px); } to { right: 0; } }
.dk-tail-note {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 28px;
  margin-left: var(--gutter);
  font: 500 13px/1.3 var(--font-ui);
  color: var(--ink-muted);
}
.dk-tail-note .num { color: var(--ink); }
.dk-tail-stop {
  /* a 44 × 44 target inside the 28 px row: it overhangs the row by 8 px each way and sits above its neighbours (the
     shuttle line, the ghost below), so the whole 44 px area hits it (DK-9) */
  position: relative;
  z-index: 1;
  min-height: var(--target);
  min-width: var(--target);
  margin: -8px 0;
  padding: 0 8px;
  border-radius: var(--r-1);
  font: 600 13px/1 var(--font-ui);
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.dk-tailw[data-end] { transition: opacity 300ms var(--ease-out); opacity: 0; }
/* 200 % zoom on a phone (§13.11): the tail line wraps as text, the shed head drops the generator chip (the start
   announcement and the lanes name it) so line 1 keeps its room */
@media (max-width: 260px) {
  .dk-tail-note { display: block; line-height: 1.4; padding: 4px 0; }
  .dk-tail-stop { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; margin: -12px 0 -12px 4px; }
  .dk-gen { display: none; }
}
.dk-tailw[data-end="retract"] .dk-shut-line { transition: transform 280ms var(--ease-shuttle); transform: scaleX(0); animation: none; }

/* ---------- Weave settings sheet (§4.11) ---------- */
.dk-ws { padding: 0 var(--s-4) var(--s-4); }
.dk-ws-sec { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.dk-ws-sec:first-child { padding-top: 4px; }
.dk-ws-lab { display: flex; flex-direction: column; gap: 3px; font: 600 15px/1.25 var(--font-ui); color: var(--ink); }
.dk-ws-lab-row { flex-direction: row; justify-content: space-between; align-items: baseline; }
.dk-ws-sub { font: 400 13px/1.3 var(--font-ui); color: var(--ink-muted); }
.dk-ws-sec:first-child, .dk-ws-prow { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
.dk-ws-stepper { flex: none; display: flex; align-items: center; border: 1px solid var(--edge); border-radius: var(--r-1); background: var(--paper); }
.dk-ws-step { width: var(--target); height: var(--target); display: grid; place-items: center; font: 600 22px/1 var(--font-ui); color: var(--ink); }
.dk-ws-step .ui-i { width: 20px; height: 20px; }
.dk-ws-n { min-width: 40px; text-align: center; font: 600 18px/1 var(--font-num); color: var(--ink); }
.dk-ws-segs { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 10px; border: 1px solid var(--edge); border-radius: var(--r-1); overflow: hidden; background: var(--paper); }
.dk-ws-seg {
  min-height: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border-left: 1px solid var(--edge);
  color: var(--ink);
}
.dk-ws-seg:first-child { border-left: 0; }
.dk-ws-seg1 { font: 600 15px/1 var(--font-ui); }
.dk-ws-seg2 { font: 400 12px/1 var(--font-ui); color: var(--ink-muted); }
.dk-ws-seg[aria-checked="true"] { background: var(--warp-tint); box-shadow: inset 0 0 0 2px var(--warp); }
.dk-ws-seg[aria-checked="true"] .dk-ws-seg1 { color: var(--warp); font-weight: 700; }
.dk-ws-seg[aria-checked="true"] .dk-ws-seg2 { color: var(--ink); }
.dk-ws-seg:focus-visible { outline-offset: -4px; box-shadow: inset 0 0 0 2px var(--warp); }
.dk-ws-tval { font: 500 15px/1 var(--font-ui); color: var(--ink-muted); }
.dk-ws-tv { color: var(--ink); font-weight: 600; }
.dk-ws-range { display: block; width: 100%; height: var(--target); margin: 6px 0 0; accent-color: var(--warp-fill); }
.dk-ws-ends { display: flex; justify-content: space-between; font: 400 13px/1 var(--font-ui); color: var(--ink-muted); }
.dk-ws-switch {
  flex: none;
  position: relative;
  width: 52px;
  height: var(--target);
}
.dk-ws-switch::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 8px;
  height: 28px;
  border-radius: 14px;
  border: 1.5px solid var(--edge);
  background: var(--paper);
  transition: background var(--dur-1) var(--ease-out);
}
.dk-ws-switch i {
  position: absolute;
  top: 13px;
  left: 6px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--ink-muted);
  transition: transform var(--dur-1) var(--ease-out);
}
.dk-ws-switch[aria-checked="true"]::before { background: var(--warp-fill); border-color: var(--warp-fill); }
.dk-ws-switch[aria-checked="true"] i { transform: translateX(22px); background: var(--on-warp); }
.dk-ws-all {
  width: 100%;
  min-height: var(--target-primary);
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 4px;
  font: 600 15px/1 var(--font-ui);
  color: var(--warp);
}
.dk-ws-all .ui-i { width: 18px; height: 18px; }
.dk-ws-note { font: 500 13px/1.3 var(--font-ui); color: var(--ink-muted); }

/* ---------- reduced motion (§12): no shuttle pass, no blinking ---------- */
@media (prefers-reduced-motion: reduce) {
  .dk-shut-line, .dk-shut-g { animation: none; }
  .dk-caret { animation: none; }
  .dk-tailw[data-end] { transition: opacity var(--dur-1) linear; }
  .dk-tailw[data-end="retract"] .dk-shut-line { transition: none; }
}

/* lanes enter 40 ms apart on a weave's start (§12.3), only with motion; the shed grows from its top edge as it opens
   (§12 step 3: it clips in from below over the reserved space, so the reader moves once, not per frame); on Follow
   (§12 step 5) the rest of the page changes at once, instead of a whole-page cross-fade (DK-13), and the followed
   text moves into the end of the thread: deck.js names the lane's (or the card's) text "dk-follow" for the old
   snapshot only, then animates that snapshot to the line where the passage begins in the thread, at the thread's
